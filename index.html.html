","t":"t5","c":"C12","s":"¿Qué debe hacer el usuario cuando la DIAN habilita un procedimiento específico de contingencia?","o":["Elegir cualquier canal informal que le resulte cómodo.","Seguir las instrucciones y plazos comunicados para el servicio afectado.","Esperar al control posterior para explicar la omisión."],"a":1,"e":["Fuente: Artículos 24 y 27 del Decreto 1165 de 2019. La contingencia se tramita conforme al procedimiento establecido por la autoridad, no mediante canales arbitrarios."]},{"id":"T5-12","t":"t5","c":"C11","s":"¿Cuál afirmación describe correctamente el papel del sistema informático en el control aduanero?","o":["Sustituye la responsabilidad del importador por la de la plataforma.","Garantiza por sí mismo la legalidad material de toda mercancía.","Facilita el registro, transmisión y control de actuaciones, sin reemplazar las obligaciones del usuario."],"a":2,"e":["Fuente: Artículos 3, 24 y 27; artículo 10, numeral 3.5. El sistema es el medio electrónico de gestión, pero la responsabilidad sobre la información y los soportes sigue en cabeza de los obligados."]},{"id":"T5-X01","t":"t5","c":"C51","s":"La DIAN anuncia una indisponibilidad del servicio que impide transmitir una declaración. El usuario conserva capturas, hora del intento y soportes. ¿Qué debe hacer además?","o":["Aplicar el procedimiento de contingencia que la autoridad establezca para el servicio y conservar trazabilidad.","Considerar la declaración aceptada desde el primer intento fallido.","Enviar el archivo por cualquier correo personal y asumir que quedó radicado.","Esperar al control posterior sin adelantar ninguna actuación."],"a":0,"e":["Fuente: Artículos 24 y 27 del Decreto 1165 de 2019, según la guía. La contingencia es un mecanismo reglado ante indisponibilidad; la evidencia ayuda a sustentar el evento, pero el usuario debe seguir el procedimiento que disponga la autoridad."]},{"id":"T5-X02","t":"t5","c":"C52","s":"Un usuario genera un archivo digital, lo almacena y puede reproducirlo, pero no fue creado en un formulario electrónico. ¿Qué distinción de la guía es pertinente?","o":["Todo archivo digital es necesariamente un documento electrónico creado en formulario.","Debe distinguirse archivo electrónico de documento electrónico según su forma de generación.","El archivo solo existe si se imprime y firma manualmente.","El archivo pierde validez por no estar almacenado en el computador de la DIAN."],"a":1,"e":["Fuente: Artículo 3, definiciones de archivo electrónico y documento electrónico. La guía diferencia el archivo electrónico como mensaje de datos generado, enviado, recibido o almacenado, del documento electrónico creado en un formulario electrónico."]},{"id":"T5-X03","t":"t5","c":"C53","s":"Una agencia transmite por SIE la información de la declaración, pero algunos datos no coinciden con la factura y la lista de empaque entregadas por el importador. ¿Qué principio operativo se incumple?","o":["La correspondencia de la información transmitida con los documentos que la soportan.","La obligación de reexportar una mercancía temporal.","La regla de constitución de garantía para consorcios.","La exigencia de inspección física en toda importación."],"a":0,"e":["Fuente: Artículo 10, numeral 3.5, y artículo 24. La guía recoge el deber de garantizar que la información enviada por los SIE corresponda a los documentos soporte; la transmisión electrónica no sanea inconsistencias."]},{"id":"T5-X04","t":"t5","c":"C54","s":"Un usuario sostiene que el artículo 24 permite realizar cualquier trámite por medios físicos cuando el sistema resulta incómodo, aunque esté disponible. ¿Cuál interpretación es correcta?","o":["El uso de SIE es obligatorio para los trámites, operaciones y obligaciones aduaneras, salvo los mecanismos excepcionales previstos.","El usuario elige libremente entre papel y sistema electrónico.","El artículo 24 se aplica únicamente a exportadores frecuentes.","El uso de SIE es voluntario si interviene una agencia de aduanas."],"a":0,"e":["Fuente: Artículo 24 del Decreto 1165 de 2019. El artículo 24 dispone que los procedimientos para cumplir trámites, operaciones u obligaciones aduaneras y aplicar regímenes deben llevarse a cabo mediante SIE."]},{"id":"T5-X05","t":"t5","c":"C55","s":"La plataforma recibe un mensaje de datos y lo almacena con condiciones que permiten conservarlo, leerlo, reproducirlo y transferirlo. ¿Qué definición se ajusta mejor?","o":["Documento de transporte, por contener datos de embarque.","Archivo electrónico, conforme a la definición del artículo 3 y la Ley 527.","Declaración aceptada, aunque no se haya diligenciado formulario.","Acta física de inspección, por tener trazabilidad digital."],"a":1,"e":["Fuente: Artículo 3, definición de archivo electrónico; artículo 12 de la Ley 527 de 1999. La definición de archivo electrónico comprende mensajes de datos generados, enviados, recibidos, almacenados o comunicados en medios electrónicos, con condiciones de conservación."]},{"id":"T5-X06","t":"t5","c":"C56","s":"La falla afecta únicamente un servicio específico y la DIAN publica instrucciones para su contingencia. La agencia decide usar un canal distinto porque le resulta más rápido. ¿Qué riesgo genera esa decisión?","o":["Ninguno, porque cualquier canal deja constancia de envío.","La actuación queda válida si se adjunta una factura comercial.","Incumple el procedimiento habilitado y puede no producir los efectos de la actuación aduanera.","La contingencia convierte a la agencia en importador directo."],"a":2,"e":["Fuente: Artículos 24 y 27; procedimiento de contingencia descrito en la guía. La contingencia no autoriza canales arbitrarios; debe seguirse el mecanismo y las instrucciones establecidas para el servicio afectado."]},{"id":"T5-X07","t":"t5","c":"C57","s":"El usuario transmitió correctamente la declaración por SIE y obtuvo constancia de recepción. ¿Qué conclusión no puede extraerse solo de ese hecho?","o":["Que la información fue recibida por el sistema.","Que existe trazabilidad de la transmisión.","Que el usuario cumplió el canal electrónico previsto.","Que la mercancía es materialmente conforme y la autoridad ya verificó todos los requisitos."],"a":3,"e":["Fuente: Artículos 3 y 24; alcance de la inspección aduanera del artículo 3. La recepción electrónica acredita una actuación de transmisión, pero no equivale por sí sola a una verificación física o documental completa ni garantiza la legalidad material de la mercancía."]},{"id":"T5-X08","t":"t5","c":"C58","s":"Una empresa conserva el archivo electrónico, pero no puede garantizar su lectura ni reproducción futura. ¿Qué aspecto de la definición de archivo electrónico queda comprometido?","o":["Las condiciones de conservación e integridad que permiten leer, reproducir y transferir el mensaje de datos.","La obligación de utilizar una agencia de aduanas de nivel 2.","La clasificación arancelaria del bien almacenado.","El término de permanencia de una importación temporal."],"a":0,"e":["Fuente: Artículo 3, definición de archivo electrónico y artículo 12 de la Ley 527 de 1999. La definición requiere que el mensaje de datos cumpla condiciones de conservación y pueda ser leído, reproducido y transferido a los SIE."]},{"id":"T5-X09","t":"t5","c":"C59","s":"Una operación fue tramitada durante una contingencia autorizada. Después se restablece el servicio. ¿Qué debe verificar el usuario para cerrar correctamente la actuación?","o":["Que el sistema haya borrado el registro del evento.","Que se hayan cumplido los pasos de regularización, transmisión o incorporación posterior exigidos por el procedimiento de contingencia.","Que el proveedor expida una factura con fecha posterior.","Que el transportador asuma la responsabilidad por la declaración."],"a":1,"e":["Fuente: Artículos 24 y 27; contingencia descrita en la guía. La contingencia no elimina la trazabilidad ni las obligaciones; deben cumplirse las instrucciones de normalización que establezca la autoridad."]},{"id":"T5-X10","t":"t5","c":"C60","s":"Un operador confunde el archivo electrónico con el documento electrónico y afirma que ambos conceptos son idénticos. ¿Cuál distinción refleja el artículo 3?","o":["El archivo electrónico solo puede contener imágenes y el documento electrónico solo texto.","El documento electrónico es cualquier archivo guardado en un computador personal.","El archivo electrónico comprende mensajes de datos conservables; el documento electrónico se genera en un formulario electrónico.","No existe diferencia jurídica entre ambos términos en la guía."],"a":2,"e":["Fuente: Artículo 3, definiciones de archivo electrónico y documento electrónico. La guía presenta definiciones distintas: archivo electrónico como mensaje de datos en medios electrónicos y documento electrónico como el generado en formulario electrónico."]}],"likert":[]}</script>
<script>
(function(){
'use strict';
var CFG=JSON.parse(document.getElementById('cfg').textContent);
var B=JSON.parse(document.getElementById('bank').textContent);
B.likert=B.likert||[];B.cases=B.cases||{};
var PASS=CFG.pass||70, GUIDE=CFG.guide||'', LOC=CFG.locale||'es-CO';
var LIK=CFG.likert||null;            /* {labels:[4], kinds:{Clave:{label,weight}}} */
var OFF=CFG.official||null;
var student={first:'',last:''},focusEvents=0;
var SHEETS_ENDPOINT='https://script.google.com/macros/s/AKfycbyhieLlGHOS8mgRjsuACwqPV4_3ZgFz0fj2kv-co9dRaXVqwmAg_UP3zOkznt2Xslyc/exec';
var MCQ=CFG.mcqLabel||'Preguntas de conocimiento';
var LET='ABCDEF';
var T={};B.topics.forEach(function(t){T[t.id]=t;t.n=0});
B.items.forEach(function(q){T[q.t].n++});
var byId={};B.items.forEach(function(q){byId[q.id]=q});
var lkById={};B.likert.forEach(function(x){lkById[x.id]=x});
var app=document.getElementById('app');
var LS={get:function(k,d){try{var v=localStorage.getItem((CFG.storage||'sim')+'_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem((CFG.storage||'sim')+'_'+k,JSON.stringify(v))}catch(e){}}};
var hist=LS.get('hist',[]), qstat=LS.get('qstat',{});
var S=null, tick=null;
var LK=(LIK&&LIK.labels)||['Totalmente en desacuerdo','En desacuerdo','De acuerdo','Totalmente de acuerdo'];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function link(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function level(p){if(p>=85)return['Sobresaliente','lv3'];if(p>=PASS)return['Aprobado','lv2'];if(p>=PASS-15)return['Cerca de aprobar','lv1'];return['En formación','lv0']}
function fmt(s){s=Math.max(0,s|0);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function groups(){var g={};B.topics.forEach(function(t){(g[t.group]=g[t.group]||[]).push(t)});return g}
function topicLink(id,text){return GUIDE?'<a href="'+GUIDE+id+'" target="_blank" rel="noopener">'+esc(text)+'</a>':'<span>'+esc(text)+'</span>'}
function pick(pool,n){
  var by={};pool.forEach(function(q){(by[q.t]=by[q.t]||[]).push(q)});
  var ids=Object.keys(by),total=pool.length;n=Math.min(n,total);
  var take={},sum=0;ids.forEach(function(t){take[t]=Math.floor(by[t].length/total*n);sum+=take[t]});
  var rest=shuffle(ids).sort(function(a,b){return take[a]-take[b]});
  for(var i=0;sum<n;i=(i+1)%rest.length){if(take[rest[i]]<by[rest[i]].length){take[rest[i]]++;sum++}}
  var out=[];ids.forEach(function(t){out=out.concat(shuffle(by[t]).slice(0,take[t]))});return shuffle(out);
}
function poolFor(area){return B.items.filter(function(q){return area==='all'||!area||T[q.t].area===area})}
function K(q){return{type:'k',q:q}}
function L(it){return{type:'l',q:it}}
function good(it){return it.g.replace(/[^ABCD]/g,'').split('').map(function(c){return'ABCD'.indexOf(c)})}
function lkScore(it,a){if(a===null||a<0)return 0;var g=good(it);if(g.indexOf(a)>=0)return 1;return g.some(function(x){return(x<2)===(a<2)})?.5:0}
function kindLabel(k){return(LIK&&LIK.kinds&&LIK.kinds[k]&&LIK.kinds[k].label)||k}
function part(it){return it.type==='k'?MCQ:kindLabel(it.q.k)}
function partOrder(){var o=[MCQ];if(LIK&&LIK.kinds)Object.keys(LIK.kinds).forEach(function(k){o.push(LIK.kinds[k].label)});return o}
function errIds(){return Object.keys(qstat).filter(function(k){return qstat[k].w>0&&qstat[k].last===0&&byId[k]})}

/* ---------- HOME ---------- */
function home(){
  stop();S=null;
  var last=hist.slice(-1)[0],best=hist.reduce(function(m,h){return Math.max(m,h.score)},0),errs=errIds().length;
  var h='<div class="eyebrow">'+esc(CFG.eyebrow||'')+'</div><h1>'+esc(CFG.title)+'</h1>'+
  '<p class="muted" style="max-width:64ch;margin:0 0 18px">'+esc(CFG.lead||'')+'</p><div class="stack">';
  if(hist.length){
    h+='<div class="panel"><div class="stats"><div class="stat"><b>'+hist.length+'</b><span>intentos</span></div><div class="stat"><b>'+last.score+'</b><span>último puntaje</span></div><div class="stat"><b>'+best+'</b><span>mejor puntaje</span></div><div class="stat"><b>'+errs+'</b><span>preguntas por repasar</span></div></div><div class="row" style="margin-top:14px"><button class="btn ghost" data-go="progress">Ver mi progreso</button></div></div>';
  }
  var sv=LS.get('saved',{}),keys=Object.keys(sv).sort(function(a,b){return sv[b].when-sv[a].when});
  if(keys.length){
    h+='<div class="panel saved"><h3>Pruebas guardadas</h3><div class="stack" style="gap:12px">';
    keys.forEach(function(k){var s=sv[k],done=s.ans.filter(function(x){return x!==null}).length,d=new Date(s.when);
      h+='<div class="saved-row"><div><b>'+esc(s.name)+'</b><div class="small muted">'+done+' de '+s.ans.length+' respondidos · vas en el ítem '+(s.i+1)+' · tiempo usado '+fmt(s.elapsed)+' · guardada el '+d.toLocaleDateString(LOC)+' a las '+d.toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})+'</div></div><div class="row"><button class="btn primary" data-resume="'+k+'">Continuar</button><button class="btn ghost" data-drop="'+k+'">Descartar</button></div></div>'});
    h+='</div></div>';
  }
  if(OFF)h+='<button class="mode hero" data-go="intro"><span class="tag">'+esc(OFF.tag||'')+'</span><b>'+esc(OFF.name)+'</b><span>'+esc(OFF.desc||'')+'</span></button>';
  h+='<div class="modes">';
  (CFG.minis||[]).forEach(function(m){h+=mode('mini:'+m.id,m.title,m.tag,m.desc)});
  h+=mode('custom','Práctica por temas','Tú eliges temas y cantidad','Ideal para reforzar un tema puntual.');
  h+=mode('errors','Repasar mis errores',errs?errs+' preguntas pendientes':'Sin errores guardados','Vuelve a las preguntas que fallaste.');
  if(LIK&&B.likert.length)h+=mode('likert',(LIK.title||'Escala de valoración'),B.likert.length+' afirmaciones',(LIK.desc||'Solo la parte de escala de cuatro puntos.'));
  h+='</div><p class="small muted">'+esc(CFG.footer||'Herramienta de práctica no oficial. Tu historial y tus pruebas guardadas quedan solo en este navegador y este dispositivo.')+'</p></div>';
  app.innerHTML=h;
}
function mode(id,t,tag,desc){return '<button class="mode" data-mode="'+esc(id)+'"><span class="tag">'+esc(tag)+'</span><b>'+esc(t)+'</b><span>'+esc(desc)+'</span></button>'}

/* ---------- INTRO (instrucciones del simulacro completo) ---------- */
function intro(){
  stop();var I=OFF.intro||{};
  var h='<button class="btn ghost" data-go="home">← Inicio</button><div class="eyebrow" style="margin-top:16px">'+esc(I.eyebrow||'')+'</div><h2>'+esc(I.heading||'Instrucciones de la prueba')+'</h2><div class="panel stack">';
  h+='<div class="scroll"><table class="hist"><thead><tr><th>Prueba</th><th>Formato</th><th class="n">Ítems aquí</th><th class="n">Peso</th><th>Carácter</th></tr></thead><tbody>';
  (I.rows||[]).forEach(function(r){h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="n">'+esc(r[2])+'</td><td class="n">'+esc(r[3])+'</td><td>'+esc(r[4])+'</td></tr>'});
  h+='</tbody></table></div>';
  (I.blocks||[]).forEach(function(b){
    h+='<div><h3>'+esc(b.title)+'</h3>';
    if(b.text)h+='<p class="small" style="margin:0;max-width:72ch">'+esc(b.text)+'</p>';
    if(b.list)h+='<ul class="small" style="margin:0;padding-left:18px;max-width:72ch">'+b.list.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    h+='</div>'});
  if(I.notice)h+='<div class="notice">'+esc(I.notice)+'</div>';
  if(I.footnote)h+='<p class="small muted" style="margin:0">'+esc(I.footnote)+'</p>';
  h+='<div class="panel" style="background:var(--bg)"><h3>Identificación del estudiante</h3><div class="grid2"><label class="field"><span>Nombres</span><input id="studentFirst" autocomplete="given-name" maxlength="80" required></label><label class="field"><span>Apellidos</span><input id="studentLast" autocomplete="family-name" maxlength="80" required></label></div><p class="small muted" style="margin:8px 0 0">Estos datos se usarán para registrar el resultado en la hoja académica.</p></div>' +
  '<div class="row"><button class="btn primary" data-mode="official">Iniciar la prueba</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);
}

/* ---------- PRÁCTICA POR TEMAS ---------- */
function setup(){
  var g=groups(),h='<button class="btn ghost" data-go="home">← Inicio</button><h2 style="margin-top:16px">Práctica por temas</h2><div class="panel stack">'+
  '<div class="grid2"><label class="field"><span>Cantidad de preguntas</span><input type="number" id="n" min="5" max="'+B.items.length+'" value="20"></label></div>'+
  '<div class="field"><span>Temas</span><div class="row small"><button class="btn ghost" type="button" data-all="1">Todos</button><button class="btn ghost" type="button" data-all="0">Ninguno</button><button class="btn ghost" type="button" data-weak="1">Mis temas débiles</button></div><div class="topics" id="tps">';
  Object.keys(g).forEach(function(k){h+='<div class="gh">'+esc(k)+'</div>';g[k].forEach(function(t){h+='<label><input type="checkbox" value="'+t.id+'" id="tp-'+t.id+'" checked> <span>'+esc(t.name)+' <span class="muted small">('+t.n+')</span></span></label>'})});
  h+='</div></div><div class="row"><button class="btn primary" id="go">Empezar</button><span class="small muted" id="cnt"></span></div></div>';
  app.innerHTML=h;
  function checked(){return[].slice.call(app.querySelectorAll('#tps input:checked')).map(function(c){return c.value})}
  var upd=function(){var sel=checked();document.getElementById('cnt').textContent=B.items.filter(function(q){return sel.indexOf(q.t)>=0}).length+' preguntas disponibles'};
  app.querySelectorAll('#tps input').forEach(function(c){c.addEventListener('change',upd)});upd();
  app.querySelector('[data-all="1"]').onclick=function(){app.querySelectorAll('#tps input').forEach(function(c){c.checked=true});upd()};
  app.querySelector('[data-all="0"]').onclick=function(){app.querySelectorAll('#tps input').forEach(function(c){c.checked=false});upd()};
  app.querySelector('[data-weak]').onclick=function(){var w=weakTopics();if(!w.length){document.getElementById('cnt').textContent='Aún no hay datos suficientes. Haz primero un simulacro.';return}app.querySelectorAll('#tps input').forEach(function(c){c.checked=w.indexOf(c.value)>=0});upd()};
  document.getElementById('go').onclick=function(){
    var sel=checked(),pool=B.items.filter(function(q){return sel.indexOf(q.t)>=0});
    if(!pool.length){document.getElementById('cnt').textContent='Elige al menos un tema.';return}
    var n=Math.max(1,parseInt(document.getElementById('n').value,10)||20);
    start({name:'Práctica por temas',kind:'practice',items:pick(pool,n).map(K)});
  };
}
function weakTopics(){
  var agg={};Object.keys(qstat).forEach(function(id){var q=byId[id];if(!q)return;var a=agg[q.t]=agg[q.t]||{r:0,n:0};a.r+=qstat[id].r;a.n+=qstat[id].r+qstat[id].w});
  return Object.keys(agg).filter(function(t){return agg[t].n>=2&&agg[t].r/agg[t].n*100<PASS});
}

/* ---------- SESIÓN ---------- */
function start(cfg){
  stop();
  S={id:cfg.id||('s'+Date.now()),name:cfg.name,kind:cfg.kind,items:cfg.items,ans:cfg.ans||cfg.items.map(function(){return null}),i:cfg.i||0,t0:Date.now()-(cfg.elapsed||0)*1000,pt:cfg.pt||{},mark:Date.now(),done:false,menu:null};
  tick=setInterval(function(){accrue();var el=document.getElementById('timer');if(el)el.textContent=fmt(elapsed());var ep=document.getElementById('ptimer');if(ep)ep.textContent=fmt(S.pt[part(S.items[S.i])]||0)},1000);
  if(!cfg.id)save();
  render();window.scrollTo(0,0);
}
function elapsed(){return Math.round((Date.now()-S.t0)/1000)}
function accrue(){if(!S||S.done||!S.items)return;var now=Date.now(),p=part(S.items[S.i]);S.pt[p]=(S.pt[p]||0)+(now-S.mark)/1000;S.mark=now}
function save(){
  if(!S||S.done||!S.items)return;
  accrue();var sv=LS.get('saved',{});
  sv[S.id]={id:S.id,name:S.name,kind:S.kind,items:S.items.map(function(x){return[x.type,x.q.id]}),ans:S.ans,i:S.i,elapsed:elapsed(),pt:S.pt,when:Date.now()};
  LS.set('saved',sv);
}
function unsave(id){var sv=LS.get('saved',{});delete sv[id];LS.set('saved',sv)}
function resume(id){
  var s=LS.get('saved',{})[id];if(!s)return home();
  var items=s.items.map(function(p){var q=p[0]==='k'?byId[p[1]]:lkById[p[1]];return q?{type:p[0],q:q}:null});
  if(items.some(function(x){return!x})){unsave(id);return home()}
  start({id:s.id,name:s.name,kind:s.kind,items:items,ans:s.ans,i:s.i,elapsed:s.elapsed,pt:s.pt});
}
window.addEventListener('pagehide',function(){if(S&&!S.done&&S.items)save()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&S&&!S.done&&S.items){focusEvents++;save()}});
function stop(){if(tick){clearInterval(tick);tick=null}}

function render(){
  var it=S.items[S.i],q=it.q,a=S.ans[S.i],n=S.items.length,answered=S.ans.filter(function(x){return x!==null}).length;
  var okc=0;S.items.forEach(function(x,k){if(x.type==='k'&&S.ans[k]!==null&&S.ans[k]===x.q.a)okc++});
  var kAns=S.items.filter(function(x,k){return x.type==='k'&&S.ans[k]!==null}).length;
  var h='<div class="bar"><div class="bar-in"><div><div class="eyebrow">'+esc(S.name)+'</div><div class="small muted">'+esc(part(it))+' · Ítem '+(S.i+1)+' de '+n+(kAns?' · Aciertos: '+okc+'/'+kAns+' ('+Math.round(okc/kAns*100)+' %)':'')+'</div></div>'+
  '<div class="row"><div class="clock"><span class="clock-l">'+esc(part(it))+'</span><span class="timer" id="ptimer">'+fmt(S.pt[part(it)]||0)+'</span><span class="clock-l">Total <span id="timer">'+fmt(elapsed())+'</span></span></div><button class="btn ghost" data-act="quit">Salir</button><button class="btn" data-act="finish">Terminar</button></div></div><div class="prog"><i style="width:'+(answered/n*100)+'%"></i></div></div>'+menuHtml(n-answered);
  if(S.items[S.i-1]&&part(S.items[S.i-1])!==part(it)&&a===null)h+='<div class="notice" style="margin-bottom:14px">Comienza la parte de <b>'+esc(part(it))+'</b>.'+(it.type==='l'?' Responde según tu forma habitual de actuar.':'')+'</div>';
  if(it.type==='k'){
    var ct=B.cases[q.c];
    if(ct&&ct.length)h+='<details class="case" open><summary>Caso</summary>'+ct.map(function(p){return'<p>'+esc(p)+'</p>'}).join('')+'</details>';
    h+='<div class="panel"><div class="qtop"><span class="chip">'+esc(T[q.t].name)+'</span><span class="small muted">'+esc(T[q.t].group)+'</span></div><p class="stem">'+(S.i+1)+'. '+esc(q.s)+'</p><ol class="opts">';
    q.o.forEach(function(o,k){var c='choice';if(a!==null){if(k===q.a)c+=' right';else if(k===a)c+=' wrong'}
      h+='<li><button class="'+c+'" data-opt="'+k+'"'+(a!==null?' disabled':'')+'><span class="L">'+LET[k]+'</span><span>'+esc(o)+(a!==null&&k===q.a?' <span class="mark">✓ Correcta</span>':'')+(a!==null&&k===a&&k!==q.a?' <span class="mark bad">✗ Tu respuesta</span>':'')+'</span></button></li>'});
    h+='</ol>';
    if(a!==null)h+=fbBox(q,a);
  }else{
    h+='<div class="panel"><div class="qtop"><span class="chip">'+esc(kindLabel(q.k))+'</span></div><p class="stem">'+(S.i+1)+'. '+esc(q.s)+'</p><div class="likert">';
    var g=good(q);
    LK.forEach(function(o,k){var c='choice';if(a!==null){if(g.indexOf(k)>=0)c+=' right';else if(k===a)c+=' wrong'}h+='<button class="'+c+'" data-opt="'+k+'"'+(a!==null?' disabled':'')+'>'+'ABCD'[k]+'. '+esc(o)+'</button>'});
    h+='</div>';
    if(a!==null)h+=lkBox(q,a);
  }
  h+='<div class="nav"><div class="row"><button class="btn" data-act="prev"'+(S.i?'':' disabled')+'>← Anterior</button></div><div class="row">';
  if(S.i<n-1)h+='<button class="btn '+(a!==null?'primary':'ghost')+'" data-act="next">'+(a!==null?'Siguiente →':'Saltar →')+'</button>';
  else h+='<button class="btn primary" data-act="finish">Ver resultados</button>';
  h+='</div></div>';
  if(n>1){h+='<div class="qgrid">';S.items.forEach(function(x,k){var st='';if(S.ans[k]!==null){st=x.type==='k'?(S.ans[k]===x.q.a?'okd':'bad'):'done'}h+='<button data-jump="'+k+'" class="'+st+(k===S.i?' cur':'')+'" aria-label="Ítem '+(k+1)+'">'+(k+1)+'</button>'});h+='</div>'}
  h+='</div>';
  app.innerHTML=h;

/* ---------- RESULTADOS ---------- */
function finish(auto){
  if(!S||S.done)return;
  accrue();stop();S.done=true;S.secs=elapsed();unsave(S.id);
  var right=0,kn=0,per={},lk={};
  S.items.forEach(function(it,k){var a=S.ans[k];
    if(it.type==='k'){kn++;var ok=a===it.q.a;if(ok)right++;var p=per[it.q.t]=per[it.q.t]||{r:0,n:0};p.n++;if(ok)p.r++}
    else{var o=lk[it.q.k]=lk[it.q.k]||{s:0,n:0};o.n++;o.s+=lkScore(it.q,a)}});
  S.right=right;S.kn=kn;S.per=per;
  S.rawScore=kn?right/kn*100:0;
  /* Cada incidencia descuenta la mitad del valor de una pregunta. */
  S.incidents= S.kind==='official' ? focusEvents : 0;
  S.penaltyPerIncident=kn?50/kn:0;
  S.penaltyPoints=S.incidents*S.penaltyPerIncident;
  S.score=Math.max(0,Math.round(S.rawScore-S.penaltyPoints));
  S.lk={};Object.keys(lk).forEach(function(k){S.lk[k]=Math.round(lk[k].s/lk[k].n*100)});
  S.total=null;
  if(S.kind==='official'&&OFF&&OFF.weights){
    var tot=OFF.weights.mcq*S.score;
    Object.keys(S.lk).forEach(function(k){tot+=((OFF.weights.kinds||{})[k]||0)*S.lk[k]});
    S.total=Math.max(0,Math.round(tot*10)/10);
  }
  if(kn){hist.push({d:new Date().toISOString(),m:S.name,n:kn,r:right,score:S.score,total:S.total,per:per,secs:S.secs,pt:S.pt});if(hist.length>200)hist=hist.slice(-200);LS.set('hist',hist)}
  results(auto);
}

function advice(s){
  if(s>=85)return'Dominas el material. Mantén el ritmo con simulacros completos cronometrados y revisa las pocas preguntas que fallaste.';
  if(s>=PASS)return'Estás por encima del mínimo de '+PASS+'. Refuerza los temas en amarillo o rojo para tener margen el día de la prueba.';
  if(s>=PASS-15)return'Estás cerca del mínimo. Repasa los temas en rojo y practícalos tema por tema antes de volver al simulacro.';
  return'Todavía hay temas sin dominar. Estudia el material por secciones y practica tema por tema antes de volver al simulacro.';

function startOfficial(){
  var first=(document.getElementById('studentFirst')||{}).value||'',last=(document.getElementById('studentLast')||{}).value||'';
  if(!first.trim()||!last.trim()){alert('Escribe tus nombres y apellidos antes de iniciar la evaluación.');return}
  student={first:first.trim(),last:last.trim()};focusEvents=0;
  var mc=[];(OFF.pick||[]).forEach(function(p){mc=mc.concat(pick(poolFor(p.area),p.n))});
  var items=shuffle(mc).map(K);
  if(LIK&&LIK.kinds)Object.keys(LIK.kinds).forEach(function(k){items=items.concat(shuffle(B.likert.filter(function(x){return x.k===k})).map(L))});
  start({name:OFF.name,kind:'official',items:items});
}
app.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-go]');if(!t)return;
  if(t.dataset.go){if(t.dataset.go==='home')home();else if(t.dataset.go==='progress')progress();else if(t.dataset.go==='intro'){OFF&&OFF.intro?intro():startOfficial()}return}
  var m=t.dataset.mode;
  if(m){
    if(m==='official')startOfficial();
    else if(m.indexOf('mini:')===0){var id=m.slice(5),mm=(CFG.minis||[]).filter(function(x){return x.id===id})[0];if(mm)start({name:mm.title,kind:'sim',items:pick(poolFor(mm.area),mm.n).map(K)})}
    else if(m==='custom')setup();
    else if(m==='errors'){var ids=errIds();if(!ids.length){t.querySelector('.tag').textContent='Sin errores pendientes. Haz un simulacro primero.';return}start({name:'Repaso de errores',kind:'practice',items:shuffle(ids.map(function(k){return byId[k]})).slice(0,50).map(K)})}
    else if(m==='likert')start({name:(LIK&&LIK.title)||'Escala de valoración',kind:'likert',items:shuffle(B.likert).map(L)});
    window.scrollTo(0,0);return;
  }
  if(t.dataset.resume){resume(t.dataset.resume);return}
  if(t.dataset.drop){if(t.dataset.armed){unsave(t.dataset.drop);home()}else{t.dataset.armed='1';t.textContent='Confirmar descarte'}return}
  if(t.dataset.weakrun){var w=t.dataset.weakrun.split(',');start({name:'Práctica de temas débiles',kind:'practice',items:pick(B.items.filter(function(q){return w.indexOf(q.t)>=0}),20).map(K)});return}
  if(t.dataset.f){review(t.dataset.f);return}
  if(!S||S.done)return;
  if(t.dataset.opt!==undefined){choose(+t.dataset.opt);return}
  if(t.dataset.jump!==undefined){S.i=+t.dataset.jump;render();window.scrollTo(0,0);return}
  var act=t.dataset.act;
  if(act==='prev'){S.i--;save();render();window.scrollTo(0,0)}
  else if(act==='next'){S.i++;save();render();window.scrollTo(0,0)}
  else if(act==='finish'){if(S.ans.some(function(x){return x===null})){S.menu='finish';render();window.scrollTo(0,0)}else finish(false)}
  else if(act==='finishnow')finish(false);
  else if(act==='quit'){S.menu='quit';S.discard=false;render();window.scrollTo(0,0)}
  else if(act==='cancel'){S.menu=null;render()}
  else if(act==='savequit'){save();stop();S=null;home()}
  else if(act==='discard'){if(!S.discard){S.discard=true;render();return}unsave(S.id);stop();S=null;home()}
});
