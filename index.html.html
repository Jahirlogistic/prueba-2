<style>
/* Layout: one centered exam column; a sticky exam bar (timer, progress) during a test; results as a scored report with per-topic bars */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --ink:#1b2321; --muted:#5b6662; --line:#d9dedb;
  --accent:#0f5c57; --accent-soft:#e3efed; --ok:#1f6b3a; --ok-soft:#e6f2e8; --bad:#a3352b; --bad-soft:#f8e7e4; --warn:#7a5a12; --warn-soft:#f6efdf;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121716; --surface:#1a201f; --ink:#e4ebe8; --muted:#9aa7a2; --line:#2e3735;
  --accent:#6cc2b9; --accent-soft:#1d3331; --ok:#7fd49a; --ok-soft:#1b3123; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e2c27a; --warn-soft:#332b18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121716; --surface:#1a201f; --ink:#e4ebe8; --muted:#9aa7a2; --line:#2e3735;
  --accent:#6cc2b9; --accent-soft:#1d3331; --ok:#7fd49a; --ok-soft:#1b3123; --bad:#f08a7e; --bad-soft:#3a1f1c; --warn:#e2c27a; --warn-soft:#332b18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 80px}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:650 clamp(26px,4.5vw,36px)/1.15 var(--display);margin:8px 0 6px;text-wrap:balance}
h2{font:650 22px/1.25 var(--display);margin:0 0 10px;text-wrap:balance}
h3{font:600 17px/1.3 var(--display);margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{text-align:left;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.mode:hover{border-color:var(--accent)}
.mode b{font:600 16px var(--display)}
.mode span{font-size:13px;color:var(--muted)}
.mode .tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{display:flex;flex-direction:column}
.stat b{font:650 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
label.opt-line{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.field{display:grid;gap:6px}
.field>span{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 16px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.topics .gh{grid-column:1/-1;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:8px}
.topics label{display:flex;gap:8px;font-size:14px;padding:3px 0;cursor:pointer}
/* exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.bar-in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.timer{font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.clock-l{font:500 11px var(--mono);letter-spacing:.04em;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.case{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:14px}
.case summary{cursor:pointer;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.case p{margin:10px 0 0;max-width:75ch}
.qtop{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chip{font:500 11px var(--mono);letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 9px}
.stem{font-weight:600;font-size:16px;margin:0 0 14px;max-width:75ch}
.opts{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.choice{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .L{font:600 13px var(--mono);color:var(--muted);padding-top:1px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .L{color:var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .L{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .L{color:var(--bad)}
.choice:disabled{cursor:default}
.fb{border-radius:6px;padding:12px 16px;margin-bottom:16px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.neutral{background:var(--accent-soft)}
.fb-h{font-weight:600;margin-bottom:4px}
.fb p{margin:0 0 6px;font-size:14px;max-width:78ch;overflow-wrap:anywhere}
.fb .src{font:400 12px var(--mono);color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-top:14px}
.qgrid button{height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font:500 12px var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.qgrid button.cur{outline:2px solid var(--ink)}
/* results */
.score{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center}
.big{font:650 64px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.level{display:inline-block;font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.lv0{background:var(--bad-soft);color:var(--bad)} .lv1{background:var(--warn-soft);color:var(--warn)} .lv2{background:var(--ok-soft);color:var(--ok)} .lv3{background:var(--accent);color:var(--surface)}
.tbars{display:grid;gap:10px}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:12px;align-items:center;font-size:14px}
.tbar .track{height:8px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.tbar .track i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.tbar .track::after{content:"";position:absolute;left:70%;top:0;bottom:0;width:1px;background:var(--ink);opacity:.5}
.tbar .pct{font:600 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbar a{color:inherit}
.rev{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hist td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.scroll{overflow-x:auto}
.spark{display:block;width:100%;height:90px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--warn-soft);border-radius:6px;padding:10px 14px;font-size:14px}
.likert{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.likert .choice{grid-template-columns:1fr;text-align:center;font-size:13px}
@media (max-width:600px){.tbar{grid-template-columns:minmax(0,1fr) 70px 44px}.likert{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:52px}}
.mode.hero{width:100%;padding:22px;border-color:var(--accent);background:var(--accent-soft)}
.mode.hero b{font-size:20px}
.mark{font:600 12px var(--mono);color:var(--ok);white-space:nowrap}
.mark.bad{color:var(--bad)}
.right-line,.why-not{font-size:14px}
.ans-label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.qgrid button.okd{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.bad{background:var(--bad-soft);border-color:var(--bad)}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
tfoot th{border-bottom:0;padding-top:10px}
.menu{border-color:var(--accent);margin-bottom:16px}
.saved{border-color:var(--accent)}
.saved-row{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.saved-row:first-child{border-top:0;padding-top:0}
.saved-row>div:first-child{min-width:0;flex:1 1 260px}

:root{--accent:#d56a2d;--accent-soft:#f8e9df}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f09a62;--accent-soft:#3a2a21}}
:root[data-theme="dark"]{--accent:#f09a62;--accent-soft:#3a2a21}
</style>

<script id="bank" type="application/json">{"topics":[{"id":"t1","name":"Sujetos y responsabilidades aduaneras","group":"Régimen aduanero colombiano","area":"Aduanas"},{"id":"t2","name":"Operación de importación","group":"Régimen aduanero colombiano","area":"Aduanas"},{"id":"t3","name":"Regímenes de importación y exportación","group":"Régimen aduanero colombiano","area":"Aduanas"},{"id":"t4","name":"Especificaciones de la mercancía","group":"Régimen aduanero colombiano","area":"Aduanas"},{"id":"t5","name":"Sistema informático aduanero","group":"Régimen aduanero colombiano","area":"Aduanas"}],"cases":{"C1":["Una compañía colombiana importa equipos industriales mediante una agencia de aduanas. La empresa entrega factura, lista de empaque y datos comerciales; la agencia prepara y presenta la declaración.","Durante una verificación se detecta que la factura suministrada omitió un descuento que afecta el valor realmente pagado."],"C2":["Dos sociedades integran un consorcio para ejecutar una obra y reciben maquinaria consignada a nombre del consorcio.","El consorcio debe adelantar los trámites de comercio exterior y actuar ante la DIAN mediante su administrador designado."],"C3":["Un importador ocasional decide realizar directamente una operación y solicita acceso al sistema informático para gestionar el trámite.","La operación involucra documentos de transporte individualizados que deben informarse antes de activar la cuenta."],"C4":["Un buque arriba a un puerto colombiano con mercancía extranjera. El transportador transmite los datos del manifiesto y los documentos de transporte.","Al descargar se detecta que el número de bultos no coincide con lo informado en los documentos de transporte."],"C5":["Una mercancía extranjera llega al territorio aduanero nacional y queda bajo control aduanero en el lugar de arribo.","El importador debe adelantar las actuaciones dentro de los términos aplicables y conservar la trazabilidad documental."],"C6":["Una empresa presenta declaración de importación y aporta factura comercial, documento de transporte, lista de empaque y vistos buenos que corresponden a la mercancía.","La autoridad verifica que los documentos soporte estén disponibles y cumplan los requisitos al momento exigido."],"C7":["Una empresa trae maquinaria para utilizarla temporalmente en Colombia y se compromete a reexportarla dentro de un plazo autorizado.","Antes de vencer el plazo, la empresa decide que la maquinaria permanezca definitivamente en el país."],"C8":["Un exportador vende mercancía nacional a un comprador en el exterior y pretende que salga del territorio aduanero nacional.","La operación debe someterse al régimen de exportación y a las formalidades que correspondan a la modalidad."],"C9":["En una inspección física, la declaración describe válvulas industriales de acero inoxidable con unas características técnicas determinadas.","La mercancía encontrada presenta características fundamentales distintas a las descritas en la declaración."],"C10":["Una importación contiene productos con referencias, materiales, dimensiones y usos diferentes.","La descripción presentada solo indica “repuestos industriales”, sin individualizar los atributos necesarios para identificar y clasificar los bienes."],"C11":["Un usuario aduanero debe presentar información de una operación mediante los Servicios Informáticos Electrónicos de la DIAN.","Durante el trámite se presenta una indisponibilidad del servicio que impide completar la actuación electrónica."],"C12":["Una agencia de aduanas gestiona operaciones para varios importadores y utiliza los servicios informáticos de la DIAN.","La agencia debe transmitir información consistente con los documentos y atender las reglas de contingencia cuando procedan."],"C13":["Una importadora negocia descuentos y pagos indirectos que inciden en el precio. La agencia solicita información adicional para valoración y recibe datos incompletos.","La DIAN contrasta los documentos entregados con la información comercial de la negociación."],"C14":["Una empresa suministra a su agencia una factura obtenida directamente del proveedor.","En control posterior se acredita que el documento fue alterado antes de ser entregado a la agencia."],"C15":["Una sucursal de sociedad extranjera participa como importadora en una operación en Colombia.","La autoridad debe establecer su calidad dentro de los sujetos de la obligación aduanera."],"C16":["Los documentos de transporte y soportes se expiden a nombre de un consorcio.","Una sociedad integrante pretende adelantar el trámite usando su propio NIT."],"C17":["La obligación aduanera de un usuario es incumplida y la autoridad adopta una medida que recae sobre la mercancía.","El obligado alega que la naturaleza personal impide afectar los bienes."],"C18":["Un operador logístico participa indirectamente en una operación y es requerido por la DIAN.","El operador afirma que solo importadores y exportadores pueden ser obligados aduaneros."],"C19":["Un importador realiza directamente la declaración de importación.","En una revisión posterior se encuentra un error en base gravable y liquidación."],"C20":["Una unión temporal proyecta operaciones de importación y exportación.","Debe organizar su identificación, representación y garantía antes de declarar."],"C21":["En el descargue de mercancías se detecta una diferencia entre la carga física y los documentos transmitidos.","El importador debe establecer el origen y tratamiento de la inconsistencia."],"C22":["Un importador prepara la declaración, pero un soporte exigible no está disponible.","El usuario propone aportarlo después del levante."],"C23":["Una mercancía está en depósito y el importador quiere retirarla antes de completar formalidades.","El usuario considera que basta con una promesa de declarar posteriormente."],"C24":["La factura agrupa valores por referencia y la lista de empaque detalla el contenido de cada bulto.","Durante la verificación se necesita establecer qué bienes contiene cada unidad."],"C25":["Una mercancía está sujeta a un visto bueno o autorización previa.","El importador presenta documentos comerciales, pero no acredita el requisito especial."],"C26":["El importador detecta una inconsistencia entre la cantidad declarada y los documentos soporte antes del levante.","Debe decidir cómo corregir sin alterar unilateralmente los soportes."],"C27":["La propiedad comercial de una mercancía se transfiere mientras esta permanece bajo control aduanero.","El comprador pretende disponer de ella antes de completar formalidades."],"C28":["El manifiesto transmitido contiene una referencia equivocada, mientras los soportes comerciales identifican correctamente la carga.","El usuario debe gestionar la inconsistencia conservando trazabilidad."],"C31":["Una maquinaria ingresó temporalmente para un proyecto con compromiso de reexportación.","Antes de vencer el plazo el importador decide venderla en Colombia."],"C32":["Una empresa ingresa equipos para reparación y posterior salida del país.","Debe establecer si la finalidad corresponde a una modalidad temporal."],"C33":["Una empresa vende mercancía nacional a un comprador extranjero y prepara la salida definitiva.","Debe identificar el régimen y modalidad aplicables."],"C34":["Un programa autorizado permite ingresar insumos para transformación y posterior exportación.","La empresa debe determinar el tratamiento aduanero de los insumos."],"C35":["Una maquinaria ingresó temporalmente y será reexportada.","El usuario debe demostrar que la mercancía que sale corresponde a la sometida al régimen."],"C36":["Durante la inspección previa a la salida se encuentran bienes distintos a los descritos en la declaración de exportación.","El exportador solicita continuar el embarque por razones comerciales."],"C37":["Una mercancía ingresó bajo importación temporal con plazo y condiciones determinados.","El importador sostiene que un pago efectuado elimina la obligación de finalizar el régimen."],"C38":["Un bien nacional sale al exterior para reparación y tiene previsto regresar a Colombia.","La empresa debe diferenciar esta salida de una exportación definitiva."],"C41":["La declaración contiene un dígito errado en el serial de un equipo.","Factura y lista de empaque previas muestran el serial real y las características fundamentales coinciden."],"C42":["La declaración omite el serial de una máquina y los documentos soporte previos tampoco lo identifican.","En inspección aparece un serial diferente al esperado por el importador."],"C43":["Una declaración describe varios repuestos de distinta naturaleza como “repuestos industriales”.","La autoridad debe establecer si la descripción individualiza suficientemente los bienes."],"C44":["La autoridad coteja declaración, factura y lista de empaque sin verificar físicamente la carga.","Debe clasificar la modalidad de inspección realizada."],"C45":["Un escáner revisa una unidad de carga sin abrirla.","La autoridad verifica la mercancía con equipos de alta tecnología."],"C46":["La factura identifica un modelo de válvula, pero omite parámetros técnicos esenciales.","La lista de empaque solo repite la denominación genérica."],"C47":["La mercancía coincide en serial, modelo, material y función, pero tiene una variación menor en el empaque.","La autoridad debe valorar si se alteran características fundamentales."],"C48":["La factura agrupa precios por referencia y la lista de empaque identifica el contenido de cada bulto.","Se requiere cotejar la mercancía física con sus soportes."],"C51":["La DIAN reporta indisponibilidad de un servicio electrónico que impide transmitir una declaración.","El usuario conserva evidencia de los intentos y debe seguir la contingencia."],"C52":["Un usuario genera y almacena un mensaje de datos que puede reproducirse, pero no fue creado en formulario electrónico.","Debe distinguir los conceptos de archivo electrónico y documento electrónico."],"C53":["Una agencia transmite datos por SIE que no coinciden con factura y lista de empaque.","El importador y la agencia deben verificar la consistencia de la información."],"C54":["El SIE está disponible, pero un usuario prefiere presentar físicamente sus actuaciones.","Invoca una interpretación amplia de la contingencia."],"C55":["Un mensaje de datos se genera, envía y almacena con condiciones de conservación.","El usuario pregunta qué definición técnica recoge el artículo 3."],"C56":["La DIAN habilita instrucciones específicas de contingencia para un servicio afectado.","La agencia decide utilizar otro canal por conveniencia."],"C57":["El SIE recibe una declaración y genera constancia de recepción.","El usuario pretende interpretar la recepción como aprobación material de la mercancía."],"C58":["Un usuario conserva un archivo electrónico sin garantizar su lectura y reproducción futura.","Debe determinar qué condición de conservación está comprometida."],"C59":["Una operación se gestiona bajo contingencia autorizada y el servicio se restablece.","El usuario debe verificar los pasos posteriores exigidos."],"C60":["Un operador usa indistintamente los términos archivo electrónico y documento electrónico.","La guía define ambos conceptos de forma diferenciada."]},"items":[{"id":"T1-01","t":"t1","c":"C1","s":"La autoridad encuentra que el importador entregó una factura con datos comerciales incompletos. ¿Quién responde por la autenticidad del documento que él suministró?","o":["La agencia, por presentar la declaración.","El importador, por el soporte que suministró.","El transportador, por movilizar la mercancía."],"a":1,"e":["Fuente: Artículo 8, modificado por el Decreto 659 de 2024. La agencia interviene en el trámite, pero el importador responde por la autenticidad de los documentos soporte que obtiene y entrega."]},{"id":"T1-02","t":"t1","c":"C1","s":"La empresa interviene directamente en la importación y firma la declaración. ¿Qué responsabilidad adicional asume según el artículo 8?","o":["La exactitud de los datos y la liquidación correcta de tributos.","La custodia física de la carga durante el transporte internacional.","La habilitación del depósito donde llega la mercancía."],"a":0,"e":["Fuente: Artículo 8, inciso sobre actuación directa. La actuación directa hace responsable al importador por los datos declarados y por la determinación de la base gravable y liquidación."]},{"id":"T1-03","t":"t1","c":"C2","s":"¿Con qué identificación deben adelantarse los trámites cuando los documentos están consignados a nombre del consorcio?","o":["Con el NIT de cualquiera de las sociedades.","Con el documento del representante de la agencia.","Con el NIT asignado al consorcio."],"a":2,"e":["Fuente: Artículo 9 del Decreto 1165 de 2019. El artículo 9 dispone utilizar el NIT del consorcio o unión temporal cuando los documentos se consignen a su nombre."]},{"id":"T1-04","t":"t1","c":"C2","s":"¿Quién debe suscribir ante la DIAN las actuaciones del consorcio?","o":["El administrador designado para representarlo.","Cualquier trabajador de una sociedad integrante.","El transportador internacional de la mercancía."],"a":0,"e":["Fuente: Artículo 9 del Decreto 1165 de 2019. Las actuaciones ante la DIAN las suscribe el administrador designado por el consorcio o unión temporal."]},{"id":"T1-05","t":"t1","c":"C3","s":"Antes de activar la cuenta para actuar directamente como importador ocasional, ¿qué debe hacer el usuario?","o":["Solicitar autorización a la agencia que opera en el puerto.","Registrar ante la DIAN los documentos de transporte de las operaciones previstas.","Presentar primero la declaración de importación definitiva."],"a":1,"e":["Fuente: Artículo 8, inciso sobre importadores ocasionales. La norma exige solicitar el registro previo de la operación en SYGA importaciones o el sistema que haga sus veces, informando cada documento de transporte."]},{"id":"T1-06","t":"t1","c":"C3","s":"Una persona intervino indirectamente en un trámite y la DIAN le solicita información relacionada con esa intervención. ¿Cómo se clasifica?","o":["Como obligado directo en todos los casos.","Como declarante autorizado automáticamente.","Como obligado indirecto, responsable por su intervención."],"a":2,"e":["Fuente: Artículo 7 del Decreto 1165 de 2019. El artículo 7 incluye como obligados indirectos a quienes intervienen indirectamente y a quienes son requeridos por la autoridad."]},{"id":"T1-07","t":"t1","c":"C1","s":"La obligación aduanera se genera por la relación entre la administración y personas vinculadas a operaciones aduaneras. ¿Cuál es su naturaleza?","o":["Personal, sin perjuicio de hacerse efectiva sobre la mercancía.","Real, exclusiva del propietario inscrito en cámara de comercio.","Contractual, limitada a quien firma con la agencia."],"a":0,"e":["Fuente: Artículos 4, 5 y 6 del Decreto 1165 de 2019. El artículo 6 define la obligación como personal, aunque su cumplimiento puede hacerse efectivo sobre la mercancía mediante abandono o decomiso."]},{"id":"T1-08","t":"t1","c":"C1","s":"La empresa solicita a la agencia presentar la declaración, pero no entrega información sobre circunstancias comerciales de la negociación. ¿Qué ocurre?","o":["La agencia asume automáticamente toda la información omitida.","El importador debe suministrar la información requerida para valoración.","La DIAN debe reconstruir los datos con el transportador."],"a":1,"e":["Fuente: Artículo 8, inciso sobre actuación mediante agencia. El importador debe entregar la totalidad de información sobre hechos y circunstancias comerciales de la negociación para valoración aduanera."]},{"id":"T1-09","t":"t1","c":"C2","s":"En el consorcio del caso, ¿cómo se distribuye la responsabilidad por el pago de tributos aduaneros?","o":["Solo responde el administrador que firma.","Responde exclusivamente la agencia de aduanas.","Es solidaria entre las personas que lo conforman."],"a":2,"e":["Fuente: Artículo 8, inciso sobre consorcios y uniones temporales. La responsabilidad por tributos es solidaria y recae sobre las personas naturales o jurídicas que integran el consorcio o unión temporal."]},{"id":"T1-10","t":"t1","c":"C1","s":"Una persona jurídica colombiana quiere importar directamente. ¿Cuál requisito general señala el artículo 10?","o":["Estar domiciliada o representada legalmente en Colombia e inscrita en el RUT con la calidad correspondiente.","Tener necesariamente una agencia de aduanas de nivel 1 como representante legal.","Acreditar cinco años de experiencia en comercio exterior."],"a":0,"e":["Fuente: Artículo 10, numeral 1.1, con modificación del Decreto 360 de 2021. El requisito descrito para personas jurídicas es domicilio o representación legal en el país e inscripción en el RUT con la calidad correspondiente."]},{"id":"T1-11","t":"t1","c":"C1","s":"Un importador actúa directamente y debe conservar documentos soporte y recibos oficiales de pago. ¿Por cuánto tiempo, según el texto de la guía?","o":["Dos años desde el levante.","Cinco años desde la presentación de la declaración.","Diez años desde la llegada del medio de transporte."],"a":1,"e":["Fuente: Artículo 10, numeral 3.7, modificado por Decreto 360 de 2021. La obligación de conservación indicada es por cinco años a partir de la presentación y aceptación de la declaración."]},{"id":"T1-12","t":"t1","c":"C1","s":"¿Cuál enunciado describe mejor a los obligados aduaneros directos?","o":["Toda persona que sea requerida por la DIAN, sin importar su intervención.","Solo los transportadores internacionales y depósitos.","Los usuarios aduaneros."],"a":2,"e":["Fuente: Artículo 7 del Decreto 1165 de 2019. El artículo 7 clasifica como directos a los usuarios aduaneros; los demás supuestos de intervención indirecta corresponden a obligados indirectos."]},{"id":"T1-X01","t":"t1","c":"C13","s":"Una importadora entrega a su agencia la factura, pero omite un acuerdo posterior de descuentos y pagos indirectos que incide en el precio. La agencia solicita los datos y la empresa no los entrega. ¿Cuál es el análisis más ajustado?","o":["La agencia responde por reconstruir cualquier condición comercial no informada.","El importador debe suministrar los hechos comerciales necesarios para la valoración.","El transportador debe certificar el precio realmente pagado por la mercancía.","La DIAN debe aceptar el valor de factura sin examinar otros elementos."],"a":1,"e":["Fuente: Artículo 8, inciso sobre actuación mediante agencia. El importador conserva el deber de entregar la información completa sobre los elementos de hecho y circunstancias comerciales relevantes para la valoración; la intervención de la agencia no suple datos que el importador debe suministrar."]},{"id":"T1-X02","t":"t1","c":"C14","s":"Una compañía importa por medio de agencia. La factura fue obtenida directamente por la compañía y resulta ser falsa. La agencia presentó la declaración con base en ella. ¿Qué responsabilidad distingue el artículo 8?","o":["La compañía responde por la autenticidad del documento que obtuvo y suministró.","La agencia responde siempre de manera exclusiva por la autenticidad de toda factura.","El transportador asume la autenticidad por haber recibido la carga.","La responsabilidad desaparece si hubo levante de la mercancía."],"a":0,"e":["Fuente: Artículo 8, inciso sobre actuación mediante agencia. La norma diferencia la responsabilidad del importador por autenticidad de los documentos que obtiene y suministra, sin convertir a la agencia en garante universal de su origen."]},{"id":"T1-X03","t":"t1","c":"C15","s":"Una empresa extranjera con sucursal en Colombia interviene como importadora y debe adelantar trámites aduaneros. ¿Qué criterio determina su inclusión como usuario aduanero?","o":["Que tenga una bodega propia dentro de un depósito habilitado.","Que su representante sea agente de aduanas de nivel 1.","Que intervenga en calidad de importador o usuario sujeto a registro aduanero.","Que haya efectuado al menos diez importaciones durante el año."],"a":2,"e":["Fuente: Artículo 3, definición de usuario aduanero, y artículo 7. La definición comprende personas naturales, jurídicas y sucursales de sociedades extranjeras que intervienen como importadores, exportadores, consorcios, uniones temporales o declarantes, entre otros supuestos."]},{"id":"T1-X04","t":"t1","c":"C16","s":"En un consorcio, los documentos de transporte están expedidos a nombre del consorcio, pero una sociedad integrante pretende presentar la declaración usando su propio NIT. ¿Cuál ajuste procede?","o":["Mantener el NIT de la sociedad que tenga mayor participación.","Usar el NIT del administrador designado por el consorcio.","Solicitar que el transportador sustituya el consignatario por la agencia.","Adelantar el trámite con el NIT asignado al consorcio."],"a":3,"e":["Fuente: Artículo 9 del Decreto 1165 de 2019. Cuando los documentos se consignan o expiden a nombre del consorcio, los trámites deben adelantarse utilizando el NIT asignado al mismo."]},{"id":"T1-X05","t":"t1","c":"C17","s":"La obligación aduanera es personal, pero la mercancía queda sometida a potestad aduanera. Un obligado incumple y la autoridad aplica una medida sobre los bienes. ¿Qué interpretación armoniza ambas reglas?","o":["La obligación deja de ser personal desde el arribo de la mercancía.","La obligación es personal, aunque su cumplimiento puede hacerse efectivo sobre la mercancía en los términos previstos.","La mercancía solo puede responder si pertenece al transportador.","La naturaleza personal impide cualquier medida sobre los bienes."],"a":1,"e":["Fuente: Artículo 6 del Decreto 1165 de 2019. El artículo 6 define la obligación como personal, sin perjuicio de que su cumplimiento pueda hacerse efectivo sobre la mercancía mediante abandono o decomiso."]},{"id":"T1-X06","t":"t1","c":"C18","s":"Un operador logístico que no figura como importador interviene indirectamente en una formalidad y la DIAN le requiere soportes de esa intervención. ¿Cuál conclusión es correcta?","o":["No puede ser obligado porque no aparece como importador.","Se convierte automáticamente en declarante directo de la operación.","Puede ser obligado indirecto y responde por su intervención y la información exigida.","Solo responde si adquiere la propiedad de la mercancía."],"a":2,"e":["Fuente: Artículo 7 del Decreto 1165 de 2019. El artículo 7 incluye como obligados indirectos a quienes intervienen indirectamente en trámites u operaciones y a quienes sean requeridos por la autoridad, según su intervención."]},{"id":"T1-X07","t":"t1","c":"C19","s":"Una persona natural importa directamente y detecta después que calculó incorrectamente la base gravable y liquidó mal los tributos. ¿Qué elemento de responsabilidad está comprometido?","o":["La exactitud y veracidad de la declaración y la correcta determinación de base y tributos.","La obligación del depósito de responder por el valor de la negociación.","La obligación del transportador de corregir la declaración del importador.","La responsabilidad de la agencia por documentos que nunca recibió."],"a":0,"e":["Fuente: Artículo 8, inciso sobre actuación directa. Cuando el importador actúa directamente, responde por la exactitud y veracidad de los datos y por la correcta determinación de la base gravable y liquidación."]},{"id":"T1-X08","t":"t1","c":"C20","s":"Una unión temporal pretende realizar operaciones de comercio exterior. Antes de presentar sus declaraciones debe revisar no solo identificación y firma, sino también la garantía prevista. ¿Qué combinación corresponde al artículo 9?","o":["NIT de cada integrante, firma de la agencia y garantía posterior al levante.","NIT del administrador, firma de cualquier integrante y garantía individual por embarque.","NIT de la unión temporal, firma del administrador designado y garantía global constituida previamente.","NIT del contratante, firma del transportador y póliza emitida después de la declaración."],"a":2,"e":["Fuente: Artículo 9 del Decreto 1165 de 2019. El artículo 9 regula el NIT del consorcio o unión temporal, la firma del administrador designado y la garantía global que debe constituirse antes de las declaraciones."]},{"id":"T2-01","t":"t2","c":"C4","s":"En la descarga se encuentran menos bultos que los registrados en el documento de transporte. ¿Qué debe permitir el registro de la inconsistencia?","o":["Dejar constancia de la diferencia para el control aduanero.","Modificar de inmediato la clasificación arancelaria.","Convertir automáticamente la operación en exportación."],"a":0,"e":["Fuente: Artículos 151 y 159, según el desarrollo de la guía. El informe de descargue e inconsistencias permite registrar diferencias entre lo informado y lo efectivamente descargado."]},{"id":"T2-02","t":"t2","c":"C4","s":"¿Cuál es el propósito del manifiesto y los documentos de transporte en el flujo de importación?","o":["Acreditar la propiedad comercial y sustituir la declaración.","Informar y soportar la carga transportada que arriba al territorio aduanero.","Autorizar por sí solos el levante de las mercancías."],"a":1,"e":["Fuente: Artículos 151 y 159 del Decreto 1165 de 2019. Los documentos de transporte y el manifiesto identifican la carga y permiten el control de su ingreso; no sustituyen la declaración ni el levante."]},{"id":"T2-03","t":"t2","c":"C5","s":"La mercancía permanece en depósito y no se somete oportunamente a un régimen ni se reembarca. ¿Qué riesgo aduanero se presenta?","o":["Se convierte automáticamente en mercancía nacional.","Se entiende exportada por vencimiento del término.","Puede configurarse abandono legal conforme a los términos aplicables."],"a":2,"e":["Fuente: Artículos 168 y 170 y definición de abandono legal del artículo 3, modificada por Decreto 659 de 2024. El abandono legal puede configurarse al vencer el término de permanencia sin reembarque, sometimiento a régimen o modificación del régimen, según corresponda."]},{"id":"T2-04","t":"t2","c":"C5","s":"¿En qué momento debe verificarse que los documentos soporte estén vigentes y cumplan los requisitos legales?","o":["Al momento de presentación de la declaración aduanera.","Únicamente cuando la mercancía ya fue entregada al comprador.","Después de que termine el control posterior."],"a":0,"e":["Fuente: Artículo 10, numeral 3.1, y artículo 177. El importador debe contar con los documentos soporte requeridos y vigentes al momento de presentar la declaración."]},{"id":"T2-05","t":"t2","c":"C6","s":"¿Cuál documento cumple la función de describir y respaldar comercialmente la operación de compraventa?","o":["La planilla de envío.","La factura comercial.","El registro de activación de usuario."],"a":1,"e":["Fuente: Artículo 177 del Decreto 1165 de 2019. La factura comercial integra los documentos soporte de la declaración y contiene información comercial relevante para la operación."]},{"id":"T2-06","t":"t2","c":"C6","s":"La empresa tiene lista de empaque, pero no aporta un documento exigido para su mercancía. ¿Qué criterio debe aplicar?","o":["Presentar la declaración y completar soportes cuando la DIAN los solicite.","Sustituir cualquier soporte faltante con una carta interna.","Asegurar que todos los documentos exigibles estén disponibles al presentar la declaración."],"a":2,"e":["Fuente: Artículo 177 y artículo 10, numeral 3.1. La lista de empaque no reemplaza los demás documentos soporte exigibles; deben estar vigentes y cumplir requisitos al presentar la declaración."]},{"id":"T2-07","t":"t2","c":"C4","s":"¿Qué fase sigue al arribo y descarga dentro de la secuencia general de importación descrita en la guía?","o":["El registro de la carga y el cumplimiento de las actuaciones de ingreso bajo control aduanero.","La exportación definitiva de la mercancía al país de origen.","La destrucción automática de los documentos de transporte."],"a":0,"e":["Fuente: Flujo secuencial de importación; artículos 151, 159, 168 y 170. La operación continúa con registros y actuaciones de ingreso y permanencia bajo control aduanero antes de la declaración y levante."]},{"id":"T2-08","t":"t2","c":"C5","s":"¿Qué significa obtener el levante dentro de la operación de importación?","o":["Obtener el documento de transporte original.","Contar con la autorización aduanera para disponer de la mercancía, una vez satisfechos los requisitos.","Trasladar la carga desde el puerto hasta el depósito sin control."],"a":1,"e":["Fuente: Secuencia de importación y disposiciones de levante del Decreto 1165 de 2019. El levante es la autorización para disponer de la mercancía después de cumplir los requisitos y controles correspondientes."]},{"id":"T2-09","t":"t2","c":"C6","s":"El declarante detecta que un soporte no corresponde a la negociación real antes de presentar la declaración. ¿Qué actuación es adecuada?","o":["Presentarlo igual y explicar la diferencia después del levante.","Eliminarlo del expediente sin verificar si es exigible.","Corregir o completar la documentación antes de presentar la declaración."],"a":2,"e":["Fuente: Artículo 10, numeral 3.1, y artículo 177. La declaración debe estar respaldada por documentos soporte válidos y concordantes; no debe presentarse con soportes inexactos."]},{"id":"T2-10","t":"t2","c":"C4","s":"¿Qué dato es relevante al registrar la entrega de carga en el lugar de arribo?","o":["Cantidad y estado de los bultos entregados, junto con datos del documento de transporte.","El margen comercial del importador y su lista de clientes.","El valor de reventa esperado en el mercado nacional."],"a":0,"e":["Fuente: Definición de planilla de entrega del artículo 3. La planilla de entrega registra los datos del documento de transporte y deja constancia de cantidad y estado de bultos y dispositivos de seguridad."]},{"id":"T2-11","t":"t2","c":"C5","s":"¿Por qué es importante respetar los términos de permanencia en depósito?","o":["Porque determinan el precio internacional de la mercancía.","Porque su vencimiento puede producir consecuencias como el abandono legal.","Porque reemplazan el requisito de presentar declaración."],"a":1,"e":["Fuente: Artículos 168 y 170; definición de abandono legal del artículo 3. El término de permanencia tiene efectos aduaneros; su vencimiento sin la actuación requerida puede generar abandono legal."]},{"id":"T2-12","t":"t2","c":"C6","s":"¿Qué función cumple el documento de transporte en la declaración de importación?","o":["Determina por sí solo el valor en aduana definitivo.","Sustituye los vistos buenos y licencias.","Identifica el transporte y la carga, y hace parte de los soportes documentales exigibles."],"a":2,"e":["Fuente: Artículo 177 y definiciones del artículo 3. El documento de transporte identifica la carga y soporta el ingreso; no reemplaza documentos comerciales, permisos o la declaración."]},{"id":"T2-X01","t":"t2","c":"C21","s":"Una mercancía llega al puerto y el transportador transmite el manifiesto. En la descarga se advierte sobrante de unidades frente a los documentos de transporte. ¿Qué debe analizarse primero para establecer la actuación aduanera?","o":["La diferencia entre lo descargado y lo informado, junto con el reporte y los documentos de transporte.","El valor comercial de venta al detal en Colombia.","La clasificación arancelaria definitiva de cada unidad antes del reporte.","La decisión del importador de nacionalizar el sobrante sin informar a la autoridad."],"a":0,"e":["Fuente: Artículos ประ El proceso de llegada, descargue e informe de inconsistencias exige contrastar la carga efectivamente descargada con manifiesto y documentos de transporte y reportar las diferencias conforme al procedimiento aplicable."]},{"id":"T2-X02","t":"t2","c":"C22","s":"El importador presenta declaración antes de tener disponible un documento soporte exigible. La mercancía está en depósito y el usuario afirma que lo aportará después del levante. ¿Cuál es el problema central?","o":["La declaración puede presentarse sin soportes siempre que el depósito certifique inventario.","La existencia del documento de transporte sustituye todos los demás soportes.","Los documentos soporte exigibles deben estar disponibles en la oportunidad prevista para respaldar la declaración.","El levante convierte automáticamente en válidos los soportes faltantes."],"a":2,"e":["Fuente: Artículo 177 y artículo 10, numeral 3.1. La declaración debe estar respaldada por los documentos soporte exigidos y estos deben estar disponibles conforme a las reglas aplicables; no basta prometer su entrega posterior."]},{"id":"T2-X03","t":"t2","c":"C23","s":"La carga se encuentra en depósito y el término para declarar está próximo a vencer. El importador propone retirar primero la mercancía y completar luego la declaración. ¿Qué principio operativo contradice esa propuesta?","o":["La mercancía puede salir siempre que el depósito registre una promesa de declaración.","El levante está condicionado al cumplimiento de los requisitos y actuaciones aduaneras aplicables.","La declaración solo es necesaria cuando existe inspección física.","La obligación aduanera nace después de que la mercancía se vende en Colombia."],"a":1,"e":["Fuente: Artículos 11, 175 y disposiciones de levante desarrolladas en la guía. La importación exige cumplir las formalidades y obtener el levante cuando corresponda; la salida del depósito no se habilita por una promesa de completar trámites."]},{"id":"T2-X04","t":"t2","c":"C24","s":"Durante el descargue, el informe registra una inconsistencia y el importador sostiene que la factura comercial demuestra que la cantidad correcta sí llegó. ¿Qué documento permite contrastar específicamente el contenido de cada bulto?","o":["La factura comercial, porque siempre detalla el contenido individual de cada caja.","El registro tributario del importador, porque contiene cantidades por referencia.","La lista de empaque, cuyo objeto es detallar las mercancías contenidas en cada bulto.","La declaración de exportación del proveedor, aunque no acompañe el embarque."],"a":2,"e":["Fuente: Artículo 3, definición de lista de empaque. La guía identifica la lista de empaque como el documento comercial cuyo objeto es detallar las mercancías contenidas en cada bulto."]},{"id":"T2-X05","t":"t2","c":"C25","s":"Una importación requiere visto bueno previo por la naturaleza de la mercancía. El importador presenta factura y documento de transporte, pero no acredita el requisito previo. ¿Qué evaluación es correcta?","o":["La factura sustituye el visto bueno cuando identifica la mercancía.","La documentación comercial no reemplaza una autorización o requisito previo exigible.","El documento de transporte habilita automáticamente el levante.","El depósito puede otorgar el visto bueno en nombre de la autoridad competente."],"a":1,"e":["Fuente: Artículo 177 y requisitos previos descritos en la guía. Los documentos comerciales soportan la operación, pero no sustituyen vistos buenos o autorizaciones previas que resulten exigibles por la naturaleza de la mercancía."]},{"id":"T2-X06","t":"t2","c":"C26","s":"El importador detecta que declaró una cantidad distinta a la soportada y la autoridad aún no ha autorizado el levante. ¿Cuál decisión refleja mejor el deber de consistencia documental?","o":["Solicitar la corrección por el procedimiento permitido antes de continuar, aportando soportes coherentes.","Esperar al control posterior porque antes del levante no puede corregirse información.","Pedir al depósito que ajuste la cantidad física sin modificar el registro aduanero.","Mantener la declaración y modificar únicamente la factura del proveedor."],"a":0,"e":["Fuente: Artículo 10, numerales 3.1 y 3.5; reglas de declaración y corrección referidas en la guía. La información declarada debe corresponder con los documentos soporte; la inconsistencia debe tratarse mediante el mecanismo procedimental permitido, no alterando documentos aisladamente."]},{"id":"T2-X07","t":"t2","c":"C27","s":"En el lugar de arribo, una mercancía queda bajo control aduanero. El comprador considera que la transferencia comercial de propiedad le permite disponer inmediatamente de ella. ¿Cuál distinción debe aplicar?","o":["La propiedad comercial elimina el control aduanero desde el endoso.","El control aduanero se mantiene y la disposición depende del cumplimiento de formalidades y levante.","El control solo aplica a mercancías que ingresan por vía aérea.","El depósito decide libremente cuándo termina la potestad aduanera."],"a":1,"e":["Fuente: Artículos 1, 11 y disposiciones de llegada y levante de la guía. La potestad aduanera cubre el ingreso y permanencia de mercancías; la transferencia comercial no sustituye el cumplimiento de las formalidades aduaneras."]},{"id":"T2-X08","t":"t2","c":"C28","s":"El transportador transmite datos del manifiesto con una referencia errada y el documento de transporte individualiza correctamente la carga. ¿Qué debe evitar el importador al tramitar la operación?","o":["Conservar trazabilidad de la inconsistencia y gestionar su corrección conforme al procedimiento.","Asumir que el documento comercial vuelve irrelevante cualquier dato transmitido.","Modificar unilateralmente el manifiesto sin intervención del responsable.","Declarar una mercancía distinta para que coincida con el error electrónico."],"a":0,"e":["Fuente: Artículos 10, 24 y disposiciones de llegada y documentos de transporte en la guía. La información transmitida debe guardar correspondencia con los soportes y las inconsistencias deben tramitarse por el procedimiento autorizado, preservando trazabilidad."]},{"id":"T3-01","t":"t3","c":"C7","s":"La maquinaria se importa para utilizarla durante un periodo definido y luego reexportarla. ¿Qué modalidad refleja esa finalidad?","o":["Importación temporal.","Importación ordinaria.","Reimportación en el mismo estado."],"a":0,"e":["Fuente: Artículo 172 y disposiciones de importación temporal del Decreto 1165 de 2019. La importación temporal permite introducir mercancías para una finalidad y plazo determinados, con obligación de terminación conforme al régimen."]},{"id":"T3-02","t":"t3","c":"C7","s":"La empresa decide dejar definitivamente en Colombia la maquinaria temporal antes del vencimiento. ¿Qué debe hacer?","o":["Mantener la modalidad sin informar a la DIAN.","Modificar la declaración a importación ordinaria o con franquicia y obtener levante, o reexportar.","Solicitar que el depósito convierta la mercancía en nacional automáticamente."],"a":1,"e":["Fuente: Artículo 208, modificado por Decreto 659 de 2024. El artículo 208 exige modificar la modalidad antes del vencimiento y obtener el levante, o reexportar, pagando lo que corresponda."]},{"id":"T3-03","t":"t3","c":"C8","s":"Una mercancía nacional sale del territorio aduanero nacional hacia un comprador extranjero. ¿Qué régimen corresponde?","o":["Tránsito aduanero.","Importación temporal.","Exportación."],"a":2,"e":["Fuente: Artículos 340, 341 y 342 del Decreto 1165 de 2019. La salida de mercancías del territorio aduanero nacional para el exterior se tramita bajo el régimen de exportación."]},{"id":"T3-04","t":"t3","c":"C8","s":"¿Cuál es la función general de la declaración aduanera en un régimen?","o":["Indicar el régimen específico aplicable y suministrar la información requerida por la autoridad.","Acreditar exclusivamente el pago del flete internacional.","Reemplazar todos los controles y vistos buenos de otras autoridades."],"a":0,"e":["Fuente: Definición de declaración aduanera, artículo 3. La declaración aduanera identifica el régimen aplicable y contiene la información requerida por la autoridad aduanera."]},{"id":"T3-05","t":"t3","c":"C7","s":"Una mercancía se importa para permanecer en Colombia sin una obligación de reexportación propia de una importación temporal. ¿Qué modalidad general se ajusta?","o":["Tráfico postal y envíos urgentes en todos los casos.","Importación ordinaria, si se cumplen los requisitos del régimen.","Exportación definitiva."],"a":1,"e":["Fuente: Artículo 172 del Decreto 1165 de 2019. La importación ordinaria permite la permanencia de la mercancía en el país una vez cumplidas las formalidades y obligaciones correspondientes."]},{"id":"T3-06","t":"t3","c":"C8","s":"¿Qué debe identificar el exportador al escoger la modalidad de exportación?","o":["Únicamente el medio de pago del comprador.","Solo el nombre del puerto de salida.","La finalidad y condiciones de la operación para aplicar la modalidad pertinente."],"a":2,"e":["Fuente: Artículos 340 a 342 y selector de modalidad de la guía. Las modalidades responden a condiciones y finalidades distintas; la selección debe corresponder a la operación real."]},{"id":"T3-07","t":"t3","c":"C7","s":"Al vencerse el plazo autorizado, la mercancía temporal no ha sido reexportada ni se ha modificado su modalidad. ¿Qué debe evitar el importador?","o":["Dejar vencer el plazo sin realizar la terminación o modificación exigida.","Verificar previamente los términos y gestionar la terminación del régimen.","Conservar la declaración y los soportes de la operación."],"a":0,"e":["Fuente: Artículo 208 y disposiciones de terminación de importación temporal. El importador debe actuar antes del vencimiento para modificar la modalidad o reexportar, según corresponda."]},{"id":"T3-08","t":"t3","c":"C8","s":"¿Cuál opción diferencia correctamente importación y exportación?","o":["Ambas describen únicamente el ingreso de mercancía extranjera.","Importación implica ingreso bajo régimen aduanero; exportación regula la salida de mercancía.","Exportación solo se aplica a mercancías extranjeras en tránsito."],"a":1,"e":["Fuente: Artículos 172 y 340–342 del Decreto 1165 de 2019. La importación regula el ingreso de mercancías y la exportación la salida del territorio aduanero nacional."]},{"id":"T3-09","t":"t3","c":"C7","s":"Una mercancía temporal va a permanecer en el país mediante una modalidad que exige pago de tributos. ¿Qué debe contemplar el importador?","o":["Que el plazo temporal se extiende sin límite al presentar una carta.","Que basta con actualizar el inventario del depósito.","El pago de tributos, intereses y demás conceptos que correspondan al modificar la modalidad."],"a":2,"e":["Fuente: Artículo 208, modificado por Decreto 659 de 2024. La modificación de modalidad puede exigir pago de tributos correspondientes a cuotas insolutas, intereses y sanción aplicable."]},{"id":"T3-10","t":"t3","c":"C8","s":"Un exportador quiere enviar mercancía al exterior de forma definitiva. ¿Qué debe hacer?","o":["Someter la operación a las formalidades de exportación definitiva.","Declararla como importación temporal para reexportación.","Usar una planilla de entrega como declaración de exportación."],"a":0,"e":["Fuente: Artículos 340, 341 y 342 del Decreto 1165 de 2019. La finalidad definitiva de salida corresponde a la modalidad de exportación definitiva, cumpliendo sus requisitos."]},{"id":"T3-11","t":"t3","c":"C7","s":"¿Por qué no debe elegirse una modalidad solo por conveniencia operativa?","o":["Porque todas las modalidades tienen idénticos efectos jurídicos.","Porque cada modalidad establece condiciones, obligaciones y efectos propios.","Porque la modalidad se define después de la venta nacional."],"a":1,"e":["Fuente: Artículo 172 y régimen de exportación, artículos 340–342. La modalidad determina el tratamiento jurídico y las obligaciones aplicables a la mercancía."]},{"id":"T3-12","t":"t3","c":"C8","s":"La mercancía sale temporalmente al exterior y se prevé su retorno bajo condiciones específicas. ¿Qué debe revisar el usuario?","o":["Solo el precio del transporte de regreso.","Únicamente la moneda pactada en la factura.","La modalidad de exportación aplicable y sus condiciones de reimportación o terminación."],"a":2,"e":["Fuente: Artículos 340 a 342 y modalidades relacionadas del Decreto 1165 de 2019. La salida temporal tiene efectos distintos de la exportación definitiva; deben revisarse las condiciones de la modalidad y el retorno."]},{"id":"T3-X01","t":"t3","c":"C31","s":"Una empresa ingresa maquinaria para usarla durante un proyecto por un plazo autorizado y asume el compromiso de reexportarla. Antes del vencimiento decide venderla y dejarla en Colombia. ¿Qué debe reconocer?","o":["La venta transforma automáticamente la modalidad temporal en ordinaria sin trámite.","Debe modificar o finalizar el régimen mediante la modalidad y formalidades permitidas antes de disponer definitivamente de ella.","Puede dejarla en el país porque ya pagó el transporte internacional.","La reexportación deja de ser exigible cuando cambia el propietario."],"a":1,"e":["Fuente: Artículos 200 y siguientes sobre importación temporal, según la guía. La importación temporal implica permanencia limitada y obligación de reexportar o finalizar el régimen conforme a las alternativas legales; la venta no extingue por sí sola el compromiso."]},{"id":"T3-X02","t":"t3","c":"C32","s":"Un importador trae equipos para reparación en Colombia y prevé reexportarlos después de la intervención. ¿Qué elemento determina si puede acogerse a una modalidad temporal?","o":["La intención comercial de venderlos en el mercado nacional.","Que el proveedor facture los bienes en moneda extranjera.","La finalidad, condiciones, plazo y obligación de reexportación previstos para la modalidad aplicable.","Que la mercancía llegue en contenedor de propiedad del importador."],"a":2,"e":["Fuente: Régimen de importación temporal desarrollado en la guía. La modalidad depende del propósito y de las condiciones regladas, incluido el plazo y la obligación de reexportar; no de la moneda o del embalaje."]},{"id":"T3-X03","t":"t3","c":"C33","s":"Una mercancía nacional sale del territorio aduanero para permanecer definitivamente en el exterior. ¿Qué régimen corresponde analizar?","o":["Exportación, con la modalidad que se ajuste a la operación.","Importación temporal para reexportación en el mismo estado.","Tránsito aduanero internacional de mercancía extranjera.","Reembarque, por tratarse de una mercancía nacional."],"a":0,"e":["Fuente: Artículos 346 y siguientes, régimen de exportación citado en la guía. La salida definitiva de mercancía nacional o nacionalizada se tramita bajo el régimen de exportación y la modalidad que corresponda."]},{"id":"T3-X04","t":"t3","c":"C34","s":"Una empresa importa mercancía para transformarla industrialmente y luego exportar el producto resultante, bajo un programa autorizado. ¿Qué análisis debe prevalecer?","o":["Tratarla como importación ordinaria porque toda mercancía que entra debe nacionalizarse definitivamente.","Aplicar sin revisar requisitos la modalidad temporal de corto plazo.","Analizar si encaja en un régimen/modalidad de transformación o perfeccionamiento con sus compromisos y controles.","Declararla como equipaje acompañado por tratarse de insumos."],"a":2,"e":["Fuente: Regímenes de importación y exportación expuestos en la guía. La finalidad de transformación y posterior exportación exige identificar la modalidad específica y sus condiciones; no se debe equiparar automáticamente a una importación ordinaria."]},{"id":"T3-X05","t":"t3","c":"C35","s":"Una empresa reexporta maquinaria que había ingresado temporalmente en el mismo estado. ¿Qué hecho es esencial para demostrar la finalización correcta?","o":["Que la maquinaria haya sido usada durante el plazo autorizado.","Que la salida corresponda a los bienes sometidos al régimen y se cumplan los requisitos de cierre.","Que el comprador extranjero pague una nueva factura por el mismo valor.","Que el depósito elimine el registro de inventario antes del embarque."],"a":1,"e":["Fuente: Régimen de importación temporal y exportación, según la guía. La finalidad de la modalidad es la reexportación de los bienes sometidos a ella; debe acreditarse la correspondencia y cumplir las formalidades de finalización."]},{"id":"T3-X06","t":"t3","c":"C36","s":"Un exportador presenta mercancía para salida definitiva, pero la inspección revela que parte de los bienes no corresponde con la descripción declarada. ¿Qué decisión es técnicamente prudente?","o":["Continuar el embarque porque el comprador ya pagó.","Cambiar el régimen a tránsito sin revisar la diferencia.","Ajustar la actuación por el procedimiento correspondiente y verificar la correspondencia antes de autorizar la salida.","Eliminar de la declaración los bienes observados sin dejar soporte."],"a":2,"e":["Fuente: Régimen de exportación y definiciones de inspección del artículo 3. La salida está sujeta al control y a la correspondencia entre lo declarado y lo presentado; la diferencia debe documentarse y tramitarse conforme al procedimiento."]},{"id":"T3-X07","t":"t3","c":"C37","s":"Un importador afirma que una mercancía temporal puede permanecer indefinidamente porque pagó los tributos al momento de ingreso. ¿Cuál es el error conceptual?","o":["Confunde el pago o garantía aplicable con el cumplimiento del plazo y la obligación de finalizar el régimen.","Confunde exportación definitiva con importación ordinaria.","Confunde la clasificación arancelaria con el valor FOB.","Confunde el documento de transporte con la lista de empaque."],"a":0,"e":["Fuente: Régimen de importación temporal desarrollado en la guía. La temporalidad está determinada por condiciones y plazos del régimen; el pago o garantía no elimina automáticamente la obligación de reexportar o finalizarlo."]},{"id":"T3-X08","t":"t3","c":"C38","s":"Un bien nacional sale temporalmente para reparación en el exterior y regresará al país. ¿Qué variable permite diferenciar esta operación de una exportación definitiva?","o":["El país donde se emitió la factura original.","La condición de salida temporal y la previsión de reimportación bajo la modalidad pertinente.","La nacionalidad del transportador que moviliza el bien.","El hecho de que el bien conserve su número de serie."],"a":1,"e":["Fuente: Regímenes de exportación expuestos en la guía. La naturaleza temporal de la salida y el retorno previsto determinan que se analice una modalidad distinta de la exportación definitiva."]},{"id":"T4-01","t":"t4","c":"C9","s":"En inspección se encuentra un bien cuyas características fundamentales no corresponden a lo declarado. ¿Cómo lo define el decreto?","o":["Mercancía diferente.","Mercancía de disposición restringida.","Mercancía en abandono voluntario."],"a":0,"e":["Fuente: Definición de mercancía diferente, artículo 3, modificada por Decreto 659 de 2024. Es mercancía diferente la que, verificada documental o físicamente, no corresponde en sus características fundamentales con la declarada."]},{"id":"T4-02","t":"t4","c":"C10","s":"La descripción “repuestos industriales” no permite distinguir materiales, dimensiones ni uso. ¿Cuál es el problema principal?","o":["La mercancía se entiende automáticamente nacional.","La descripción es insuficiente para individualizar e identificar adecuadamente los bienes.","El documento de transporte pierde validez por completo."],"a":1,"e":["Fuente: Artículo 3, definiciones; artículo 177 y tema de especificaciones de la guía. Una descripción debe permitir identificar la mercancía con atributos relevantes; una expresión genérica puede ser insuficiente."]},{"id":"T4-03","t":"t4","c":"C9","s":"¿Qué debe comparar la autoridad al verificar si existe mercancía diferente?","o":["El precio de venta local frente al precio sugerido.","El nombre comercial frente al nombre del proveedor.","Las características fundamentales de la mercancía física o documental frente a lo declarado."],"a":2,"e":["Fuente: Definición de mercancía diferente, artículo 3. La comparación se centra en la correspondencia de características fundamentales, no solo en el nombre o precio."]},{"id":"T4-04","t":"t4","c":"C10","s":"¿Qué aporta una lista de empaque en una operación con múltiples referencias?","o":["Detalle de bultos, contenido y distribución de los bienes para facilitar su identificación y verificación.","La autorización de levante de todas las mercancías.","La clasificación arancelaria obligatoria emitida por la DIAN."],"a":0,"e":["Fuente: Artículo 177 y apartado de lista de empaque de la guía. La lista de empaque facilita identificar el contenido de los bultos y contrastarlo con los documentos y la mercancía."]},{"id":"T4-05","t":"t4","c":"C9","s":"La inspección encuentra la misma referencia declarada, pero con material y capacidad técnica distintos. ¿Qué debe analizarse?","o":["Solo si el empaque exterior tiene el mismo color.","Si las diferencias afectan características fundamentales y la correspondencia con lo declarado.","Únicamente si el proveedor mantiene el mismo nombre comercial."],"a":1,"e":["Fuente: Definición de mercancía diferente, artículo 3. Las características fundamentales son determinantes para establecer correspondencia; variaciones sustanciales pueden configurar mercancía diferente."]},{"id":"T4-06","t":"t4","c":"C10","s":"¿Cuál descripción técnica es más útil para identificar una válvula industrial?","o":["“Accesorios varios”.","“Piezas para mantenimiento”.","Tipo de válvula, material, diámetro, presión nominal y función."],"a":2,"e":["Fuente: Artículo 3 y apartado de especificaciones de mercancía de la guía. Los atributos técnicos concretos permiten diferenciar el bien y respaldar su identificación y clasificación."]},{"id":"T4-07","t":"t4","c":"C10","s":"La lista de empaque indica 20 cajas, pero físicamente se reciben 18. ¿Qué procede en el control de la operación?","o":["Registrar y aclarar la inconsistencia con los documentos y la verificación física.","Cambiar la descripción arancelaria sin revisar la carga.","Ignorar la diferencia si la factura conserva el valor total."],"a":0,"e":["Fuente: Artículo 177 y reglas de informe de descargue e inconsistencias de los artículos 151 y 159. Las diferencias de cantidad deben registrarse y analizarse con los documentos soporte y los controles de ingreso."]},{"id":"T4-08","t":"t4","c":"C9","s":"¿La coincidencia del nombre comercial garantiza que no exista mercancía diferente?","o":["Sí, el nombre comercial prevalece sobre toda característica técnica.","No; deben contrastarse las características fundamentales de los bienes.","Sí, siempre que el proveedor sea el mismo."],"a":1,"e":["Fuente: Definición de mercancía diferente, artículo 3. La definición legal se basa en características fundamentales, por lo que el nombre comercial por sí solo no es suficiente."]},{"id":"T4-09","t":"t4","c":"C10","s":"¿Por qué los documentos soporte deben ser coherentes entre sí?","o":["Porque reemplazan la inspección física en cualquier circunstancia.","Porque permiten omitir datos técnicos de la declaración.","Porque respaldan la descripción, cantidad, valor y demás datos declarados."],"a":2,"e":["Fuente: Artículo 177 y artículo 10, numeral 3.1. Los documentos soportan la información de la declaración y deben corresponder con la operación y la mercancía."]},{"id":"T4-10","t":"t4","c":"C9","s":"Durante la inspección, la autoridad identifica mercancía que no corresponde con lo descrito. ¿Cuál es el paso lógico?","o":["Documentar el hallazgo y aplicar el procedimiento aduanero correspondiente.","Autorizar automáticamente el levante por tratarse de una diferencia física.","Sustituir la declaración por la factura sin actuación adicional."],"a":0,"e":["Fuente: Definición de mercancía diferente, artículo 3, y disposiciones de inspección. El hallazgo debe quedar sustentado y tramitarse según las reglas aduaneras; no produce levante automático."]},{"id":"T4-11","t":"t4","c":"C10","s":"¿Qué relación existe entre descripción y clasificación arancelaria?","o":["La clasificación depende solo de la marca y del país de origen.","La identificación técnica de la mercancía aporta elementos para determinar su clasificación.","La descripción puede omitirse si existe lista de empaque."],"a":1,"e":["Fuente: Artículo 3 y apartado de especificaciones técnicas de la guía. La clasificación requiere identificar objetivamente el producto; sus características técnicas son relevantes."]},{"id":"T4-12","t":"t4","c":"C9","s":"Una discrepancia menor de empaque no altera la naturaleza ni las características fundamentales del bien. ¿Qué análisis corresponde?","o":["Declarar siempre mercancía diferente ante cualquier variación.","Ignorar todos los hallazgos de inspección.","Determinar si la diferencia afecta realmente la correspondencia fundamental con lo declarado."],"a":2,"e":["Fuente: Definición de mercancía diferente, artículo 3. La definición exige falta de correspondencia en características fundamentales; no toda variación secundaria configura mercancía diferente."]},{"id":"T4-X01","t":"t4","c":"C41","s":"En inspección física se encuentra un equipo cuyo serial declarado es CMP-2024-88915X y el serial real es CMP-2024-88914X. La factura y la lista de empaque anteriores a la declaración muestran el serial real y las demás características coinciden. ¿Cuál calificación corresponde según el ejemplo de la guía?","o":["Mercancía diferente por cualquier diferencia de un carácter.","Descripción errada o incompleta del serial, susceptible de análisis integral con los soportes.","Mercancía no presentada porque la factura no reemplaza el serial.","Cambio de clasificación arancelaria por alteración de una cifra."],"a":1,"e":["Fuente: Artículo 3, definición de descripción errada o incompleta y mercancía diferente, modificado por Decreto 659 de 2024. La guía presenta el caso de un dígito errado en el serial como error parcial de descripción cuando los documentos soporte previos corroboran el serial real y las características fundamentales."]},{"id":"T4-X02","t":"t4","c":"C42","s":"La declaración omite por completo el serial de una máquina y ninguno de los documentos soporte previos permite identificarlo. En inspección aparece un serial que no coincide con otro equipo de la misma referencia. ¿Qué aspecto impide aplicar sin más el ejemplo de error parcial?","o":["La falta de respaldo documental previo para corroborar el dato correcto y la identidad del bien.","Que el serial sea un dato técnico y no comercial.","Que la mercancía tenga una marca reconocida internacionalmente.","Que el inspector haya realizado una inspección física no intrusiva."],"a":0,"e":["Fuente: Artículo 3, definición de mercancía diferente y análisis integral, Decreto 659 de 2024. El ejemplo de la guía exige soporte previo que corrobore el serial real; la omisión total sin soporte no permite presumir automáticamente un simple error parcial."]},{"id":"T4-X03","t":"t4","c":"C43","s":"La declaración describe “repuestos industriales” para una partida con rodamientos, válvulas y sensores de distintos materiales y dimensiones. ¿Qué defecto técnico tiene esa descripción?","o":["Es demasiado específica y restringe la clasificación.","No individualiza los atributos que permiten identificar cada mercancía y contrastarla con la nomenclatura.","Es suficiente si la factura incluye el nombre del proveedor.","Solo es defectuosa cuando el valor declarado es inferior al de mercado."],"a":1,"e":["Fuente: Artículo 3 y apartado de especificaciones técnicas de la guía. La descripción debe permitir identificar objetivamente los bienes; una denominación genérica no diferencia naturaleza, composición, función o características relevantes."]},{"id":"T4-X04","t":"t4","c":"C44","s":"En una inspección documental, la autoridad compara declaración, factura y lista de empaque sin abrir la unidad de carga. ¿Qué tipo de inspección está realizando?","o":["Física no intrusiva, porque revisa documentos digitalizados.","Física intrusiva, porque compara tres documentos.","Documental, porque se basa en la declaración y documentos que la acompañan.","Posterior, necesariamente, porque no observa la mercancía."],"a":2,"e":["Fuente: Artículo 3, definición de inspección aduanera. La guía distingue inspección física cuando se verifica la mercancía y documental cuando se realiza únicamente con base en la declaración y sus documentos."]},{"id":"T4-X05","t":"t4","c":"C45","s":"Un escáner permite revisar el contenido de una unidad de carga sin abrirla. ¿Cómo clasifica la guía esta inspección física?","o":["No intrusiva, por utilizar equipos de alta tecnología sin apertura de la unidad o bultos.","Documental, porque no hay contacto directo con la mercancía.","Intrusiva, porque se verifica el contenido del contenedor.","Posterior, porque se realiza después del arribo."],"a":0,"e":["Fuente: Artículo 3, definición de inspección aduanera. La inspección física es no intrusiva cuando se realiza con equipos de alta tecnología sin abrir unidades de carga o bultos."]},{"id":"T4-X06","t":"t4","c":"C46","s":"La factura identifica el modelo de una válvula, pero no informa material, diámetro ni presión nominal. La lista de empaque solo indica “válvulas”. ¿Qué información adicional resulta relevante para evaluar la descripción?","o":["El nombre del vendedor y la fecha de pago.","El número de contenedor y la naviera únicamente.","Los atributos técnicos que determinan identidad y diferenciación del producto.","El domicilio del comprador y la moneda de facturación."],"a":2,"e":["Fuente: Artículo 3 y apartado de especificaciones técnicas de la guía. Las especificaciones deben permitir identificar la mercancía mediante sus características relevantes, por ejemplo material, dimensiones, función y parámetros técnicos."]},{"id":"T4-X07","t":"t4","c":"C47","s":"La autoridad encuentra una variación en el color del empaque, pero coinciden serial, modelo, material, función y demás características fundamentales. ¿Qué razonamiento se ajusta a la definición de mercancía diferente?","o":["Toda diferencia física configura mercancía diferente sin valorar su relevancia.","Debe evaluarse si la variación afecta características fundamentales; una diferencia secundaria no basta por sí sola.","La inspección debe ignorar cualquier diferencia de empaque.","La coincidencia de serial impide siempre cualquier hallazgo aduanero."],"a":1,"e":["Fuente: Artículo 3, definición de mercancía diferente, Decreto 659 de 2024. La definición se centra en la falta de correspondencia de características fundamentales; las variaciones secundarias requieren análisis y no determinan automáticamente mercancía diferente."]},{"id":"T4-X08","t":"t4","c":"C48","s":"La lista de empaque discrimina el contenido de cada caja, mientras la factura agrupa el valor por referencia. ¿Cuál es el uso probatorio más preciso de la lista?","o":["Sustituir la factura para establecer el precio pagado.","Reemplazar el documento de transporte como prueba del embarque.","Detallar las mercancías contenidas en cada bulto y apoyar el cotejo físico-documental.","Determinar por sí sola el origen preferencial de los productos."],"a":2,"e":["Fuente: Artículo 3, definición de lista de empaque, y artículo 177. La lista de empaque tiene por objeto detallar el contenido de cada bulto y sirve como soporte para contrastar la mercancía declarada y la presentada."]},{"id":"T5-01","t":"t5","c":"C11","s":"¿Qué canal prevé la regulación para adelantar actuaciones aduaneras electrónicas?","o":["Servicios Informáticos Electrónicos dispuestos por la DIAN.","Mensajes informales en redes sociales.","Únicamente documentos impresos entregados al transportador."],"a":0,"e":["Fuente: Definiciones del artículo 3 y artículos 24 y 27, según la guía. Los Servicios Informáticos Electrónicos son el canal dispuesto para presentar y gestionar información y actuaciones aduaneras."]},{"id":"T5-02","t":"t5","c":"C11","s":"Durante una indisponibilidad del servicio electrónico, ¿qué debe hacer el usuario?","o":["Repetir indefinidamente el envío sin conservar evidencia.","Aplicar el procedimiento de contingencia previsto por la autoridad para el servicio afectado.","Dar por aprobada la declaración sin transmisión."],"a":1,"e":["Fuente: Artículos 24 y 27 del Decreto 1165 de 2019. La contingencia permite gestionar la actuación cuando el sistema no está disponible, conforme a los mecanismos y condiciones establecidos."]},{"id":"T5-03","t":"t5","c":"C12","s":"La agencia transmite un dato distinto al que aparece en la factura y demás soportes. ¿Qué obligación se compromete?","o":["La obligación de reexportar mercancías temporales.","La obligación de constituir una garantía global del consorcio.","La correspondencia entre la información transmitida y los documentos soporte."],"a":2,"e":["Fuente: Artículo 10, numeral 3.5. El importador o exportador debe garantizar que la información enviada por los Servicios Informáticos Electrónicos corresponda a los documentos que la soportan."]},{"id":"T5-04","t":"t5","c":"C11","s":"¿Qué caracteriza una contingencia informática aduanera?","o":["Un mecanismo para atender una indisponibilidad tecnológica bajo reglas establecidas.","Una autorización permanente para no usar los sistemas electrónicos.","Una exención automática de tributos aduaneros."],"a":0,"e":["Fuente: Artículos 24 y 27 del Decreto 1165 de 2019. La contingencia es excepcional y se aplica bajo el procedimiento previsto cuando no es posible usar el servicio informático."]},{"id":"T5-05","t":"t5","c":"C12","s":"¿Quién define los procedimientos y condiciones de uso de los Servicios Informáticos Electrónicos aduaneros?","o":["Cada importador, según sus políticas internas.","La autoridad aduanera, en el marco de sus competencias.","El transportador, mediante el documento de transporte."],"a":1,"e":["Fuente: Artículos 24 y 27 y definiciones del artículo 3. Los servicios y sus reglas son administrados por la autoridad aduanera; los usuarios deben observar sus procedimientos."]},{"id":"T5-06","t":"t5","c":"C11","s":"Un usuario no puede presentar una actuación por caída del sistema. ¿Qué evidencia resulta útil conservar?","o":["Solo una captura del inventario físico.","Una declaración verbal del conductor.","La evidencia de la indisponibilidad y los soportes de la actuación intentada."],"a":2,"e":["Fuente: Artículos 24 y 27; procedimiento de contingencia. Conservar evidencia permite sustentar que la actuación no pudo realizarse por indisponibilidad y seguir el procedimiento aplicable."]},{"id":"T5-07","t":"t5","c":"C12","s":"¿Qué riesgo genera transmitir información incompleta o inconsistente en el sistema?","o":["Puede afectar el control aduanero y la veracidad de la actuación.","Convierte automáticamente al usuario en OEA.","Elimina la obligación de conservar documentos soporte."],"a":0,"e":["Fuente: Artículo 10, numerales 3.5 y 3.7. La información electrónica debe coincidir con los soportes; la inconsistencia afecta la confiabilidad y el control de la operación."]},{"id":"T5-08","t":"t5","c":"C11","s":"¿La contingencia permite desconocer los requisitos sustanciales de la operación?","o":["Sí, mientras el sistema permanezca fuera de servicio.","No; atiende la imposibilidad tecnológica, pero no elimina las obligaciones aduaneras.","Sí, si el usuario presenta una comunicación comercial."],"a":1,"e":["Fuente: Artículos 24 y 27 del Decreto 1165 de 2019. La contingencia habilita un mecanismo alterno o excepcional de trámite; no constituye una exención general de obligaciones."]},{"id":"T5-09","t":"t5","c":"C12","s":"Un importador registra previamente documentos de transporte para actuar como ocasional en SYGA. ¿Qué delimita ese registro?","o":["Todas las operaciones futuras sin límite.","La representación legal de cualquier tercero.","Las actuaciones relacionadas con los documentos de transporte previamente informados."],"a":2,"e":["Fuente: Artículo 8, inciso sobre importadores ocasionales. El importador ocasional solo puede realizar actuaciones aduaneras relacionadas con los documentos previamente informados."]},{"id":"T5-10","t":"t5","c":"C11","s":"¿Qué principio debe orientar el uso de medios electrónicos sin sacrificar el control aduanero?","o":["Eficiencia y facilitación, dentro del marco de control y gestión del riesgo.","Supresión de toda verificación documental.","Prioridad absoluta de la rapidez sobre la legalidad."],"a":0,"e":["Fuente: Artículo 2, principios generales, y artículos 24 y 27. La eficiencia facilita el comercio, pero no excluye el control; el sistema de gestión del riesgo articula seguridad y facilitación."]},{"id":"T5-11
